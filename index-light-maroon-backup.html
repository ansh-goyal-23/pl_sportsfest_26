<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prateek Laurel Sports Fest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --maroon:#7C1F2B;
  --maroon-dark:#5A1520;
  --gold:#C08A2E;
  --gold-light:#E3B45C;
  --cream:#F6F1E6;
  --cream-dim:#EDE4D3;
  --ink:#201A17;
  --green:#2F4A3C;
  --line:#D8CBB0;
  --white:#FFFDF9;
  --radius:2px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--ink);}
h1,h2,h3,.display{
  font-family:'Anton',sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:0.01em;
  line-height:0.95;
  margin:0;
}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ===== Lane divider pattern ===== */
.lane-rule{
  height:6px;
  background:repeating-linear-gradient(90deg,var(--maroon) 0 26px, transparent 26px 34px);
  opacity:.85;
}
.lane-rule.gold{background:repeating-linear-gradient(90deg,var(--gold) 0 26px, transparent 26px 34px);}

/* ===== Topbar / Nav ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--ink);
  color:var(--cream);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;flex:none;}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-text .b1{font-family:'Anton';font-size:15px;letter-spacing:.03em;color:var(--gold-light);}
.brand-text .b2{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;color:#C9BFA9;margin-top:3px;}
nav.mainnav{display:flex;gap:2px;flex-wrap:wrap;}
nav.mainnav a{
  font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;
  padding:9px 12px;color:#D8CFBE;border-bottom:2px solid transparent;
  transition:.15s;white-space:nowrap;
}
nav.mainnav a:hover{color:var(--gold-light);}
nav.mainnav a.active{color:var(--gold-light);border-bottom-color:var(--gold);}
.nav-toggle{display:none;background:none;border:1px solid #4a413a;color:var(--cream);padding:8px 10px;}
@media(max-width:940px){
  nav.mainnav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--ink);flex-direction:column;padding:6px 12px 14px;border-top:1px solid #3a322c;}
  nav.mainnav.open{display:flex;}
  nav.mainnav a{padding:11px 6px;border-bottom:1px solid #322b25;}
  .nav-toggle{display:block;}
}

/* ===== Ticker ===== */
.ticker-wrap{
  background:var(--maroon);color:var(--white);
  display:flex;align-items:stretch;overflow:hidden;
  border-bottom:1px solid var(--maroon-dark);
}
.ticker-label{
  flex:none;background:var(--gold);color:var(--ink);
  font-family:'JetBrains Mono';font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:8px 14px;display:flex;align-items:center;gap:6px;
}
.ticker-track{flex:1;overflow:hidden;position:relative;white-space:nowrap;display:flex;align-items:center;}
.ticker-move{display:inline-flex;padding-left:100%;animation:tickmove 64s linear infinite;}
.ticker-move:hover{animation-play-state:paused;}
@keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ticker-item{
  font-family:'JetBrains Mono';font-size:12.5px;padding:8px 34px 8px 0;cursor:pointer;
  border-right:1px dashed rgba(255,255,255,.25);margin-right:34px;
}
.ticker-item:hover{color:var(--gold-light);}
.ticker-tag{color:var(--gold-light);margin-right:8px;}

/* ===== Layout helpers ===== */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
section{padding:64px 0;}
.eyebrow{
  font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--maroon);display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--gold);}
.h-xl{font-size:clamp(40px,7vw,84px);}
.h-lg{font-size:clamp(30px,4.5vw,52px);}
.h-md{font-size:clamp(22px,3vw,30px);}
.sub{font-size:17px;line-height:1.65;color:#4a4139;max-width:640px;}

/* ===== Hero ===== */
.hero{
  position:relative;background:var(--ink);color:var(--cream);overflow:hidden;
  padding:0;
}
.hero-inner{max-width:1180px;margin:0 auto;padding:76px 20px 60px;position:relative;z-index:2;}
.hero-dates{
  display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono';
  font-size:13px;letter-spacing:.08em;color:var(--gold-light);border:1px solid #4a413a;
  padding:7px 14px;margin-bottom:26px;
}
.hero h1{color:var(--white);}
.hero h1 .accent{color:var(--gold);}
.hero-lede{max-width:560px;color:#C9BFA9;font-size:17px;line-height:1.7;margin-top:22px;}
.hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;font-family:'JetBrains Mono';font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid transparent;transition:.15s;
}
.btn-primary{background:var(--gold);color:var(--ink);font-weight:700;}
.btn-primary:hover{background:var(--gold-light);}
.btn-outline{border-color:#5a514a;color:var(--cream);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-light);}
.btn-dark{background:var(--ink);color:var(--cream);}
.btn-dark:hover{background:var(--maroon);}
.btn-sm{padding:9px 16px;font-size:11px;}
.hero-track{position:absolute;bottom:0;left:0;right:0;height:120px;opacity:.5;}
.wreath-decor{position:absolute;right:-40px;top:-40px;width:420px;height:420px;opacity:.14;z-index:1;}

/* ===== Cards ===== */
.grid{display:grid;gap:22px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--white);border:1px solid var(--line);padding:26px;
  transition:.18s;position:relative;
}
.card:hover{border-color:var(--maroon);transform:translateY(-2px);box-shadow:0 10px 24px rgba(32,26,23,.08);}
.card .tag{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.1em;color:var(--maroon);text-transform:uppercase;}
.card h3{font-size:24px;margin-top:8px;}
.card p{color:#5a5148;font-size:14.5px;line-height:1.55;margin-top:10px;}
.update-card{display:flex;gap:16px;align-items:flex-start;}
.update-thumb{
  flex:none;width:120px;height:120px;background:var(--cream-dim);
  border-radius:var(--radius);border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:.2s;
}
.update-thumb:hover{border-color:var(--gold);}
.update-thumb img{max-width:100%;max-height:100%;object-fit:contain;}
.update-body{flex:1;min-width:0;}
@media(max-width:600px){
  .update-card{flex-direction:column;}
  .update-thumb{width:100%;height:160px;}
}
.sport-card{cursor:pointer;overflow:hidden;padding:0;}
.card-cover{height:118px;position:relative;overflow:hidden;}
.card-cover svg{position:absolute;inset:0;width:100%;height:100%;transition:.3s;}
.sport-card:hover .card-cover svg{transform:scale(1.06);}
.card-content{position:relative;z-index:1;padding:26px;}
.cv-freedom-run{background:linear-gradient(135deg,#F4A340,#E8613D);}
.cv-field-games{background:linear-gradient(135deg,#4FA8E0,#2F6FBF);}
.cv-basketball{background:linear-gradient(135deg,#3F7FA8,#1F5B7A);}
.cv-lawn-tennis{background:linear-gradient(135deg,#8BC34A,#2F6B3F);}
.cv-badminton{background:linear-gradient(135deg,#C1442D,#7A2418);}
.cv-table-tennis{background:linear-gradient(135deg,#2F6FBF,#1B3A66);}
.cv-chess{background:linear-gradient(135deg,#2B2B3D,#565676);}
.cv-carrom{background:linear-gradient(135deg,#D9A441,#9C6B1F);}
.cv-pool{background:linear-gradient(135deg,#1F5B3F,#123324);}
.cv-football{background:linear-gradient(135deg,#3FA34D,#1F6B2E);}
.sport-card .meta{display:flex;gap:14px;margin-top:14px;font-family:'JetBrains Mono';font-size:11px;color:#8a7f6e;flex-wrap:wrap;}
.sport-card .meta span{display:flex;align-items:center;gap:5px;}

.badge{
  display:inline-block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;
  padding:4px 9px;border:1px solid currentColor;text-transform:uppercase;
}
.badge.gold{color:var(--gold);}
.badge.maroon{color:var(--maroon);}
.badge.green{color:var(--green);}
.badge.grey{color:#8a7f6e;}

/* ===== Timeline ===== */
.timeline{position:relative;margin-top:40px;padding-left:28px;border-left:2px solid var(--line);}
.tl-item{position:relative;padding-bottom:34px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-34px;top:2px;width:14px;height:14px;background:var(--maroon);border:3px solid var(--cream);border-radius:50%;box-shadow:0 0 0 2px var(--maroon);}
.tl-date{font-family:'JetBrains Mono';font-size:11.5px;color:var(--maroon);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.tl-item h4{font-family:'Anton';font-size:19px;text-transform:uppercase;}
.tl-item p{color:#5a5148;font-size:14px;margin-top:5px;max-width:560px;}

/* ===== Footer ===== */
footer{background:var(--ink);color:#C9BFA9;padding:52px 0 26px;margin-top:40px;}
footer h4{color:var(--gold-light);font-family:'JetBrains Mono';font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
footer .fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;}
@media(max-width:700px){footer .fgrid{grid-template-columns:1fr;}}
footer a.flink{display:block;padding:5px 0;font-size:13.5px;color:#C9BFA9;}
footer a.flink:hover{color:var(--gold-light);}
.footer-bottom{border-top:1px solid #3a322c;margin-top:36px;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:#8a7f6e;}
.footer-bottom a{color:#8a7f6e;}
.footer-bottom a:hover{color:var(--gold-light);}

/* ===== Forms ===== */
.field{margin-bottom:18px;}
.field label{display:block;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--maroon);margin-bottom:7px;}
.field .hint{font-size:12px;color:#8a7f6e;margin-top:5px;}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=password],select,textarea,input[type=date],input[type=time],input[type=url]{
  width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--white);
  font-family:'Work Sans';font-size:14.5px;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--maroon);outline-offset:1px;border-color:var(--maroon);}
textarea{resize:vertical;min-height:90px;}
.form-card{background:var(--white);border:1px solid var(--line);padding:34px;max-width:680px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.form-grid-2{grid-template-columns:1fr;}}
.upload-box{border:1.5px dashed var(--line);padding:22px;text-align:center;background:var(--cream-dim);cursor:pointer;}
.upload-box:hover{border-color:var(--maroon);}
.upload-box.has-img{padding:14px;}
.qr-box{background:var(--white);border:1px solid var(--line);padding:20px;text-align:center;}
.msg-banner{padding:14px 18px;font-size:14px;margin-bottom:20px;border-left:4px solid;}
.msg-banner.ok{background:#EAF3EC;border-color:var(--green);color:#1f3a2c;}
.msg-banner.err{background:#F7E8E4;border-color:#B0463C;color:#6b2a22;}
.msg-banner.info{background:#F1EADB;border-color:var(--gold);color:#5c4713;}

/* ===== Table / list rows ===== */
.data-row{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);}
@media(max-width:700px){.data-row{grid-template-columns:1fr;gap:8px;}}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;}
.filter-bar select,.filter-bar input{width:auto;min-width:160px;}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
.pill{padding:8px 16px;border:1px solid var(--line);font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:.05em;background:var(--white);text-transform:uppercase;}
.pill.active{background:var(--maroon);color:var(--white);border-color:var(--maroon);}

/* ===== Section headers with dividers ===== */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:20px;flex-wrap:wrap;}

/* ===== Rules content ===== */
.rules-block h4{font-family:'Anton';font-size:16px;text-transform:uppercase;color:var(--maroon);margin:26px 0 10px;letter-spacing:.02em;}
.rules-block h4:first-child{margin-top:0;}
.rules-block ul{margin:0 0 14px;padding-left:20px;}
.rules-block li{margin-bottom:6px;font-size:14.5px;line-height:1.6;color:#3a332c;}
.rules-block table{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:13.5px;}
.rules-block th,.rules-block td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
.rules-block th{background:var(--cream-dim);font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
.rules-block p{font-size:14.5px;line-height:1.6;color:#3a332c;}

/* ===== Detail page hero band ===== */
.detail-band{background:var(--maroon);color:var(--white);padding:52px 0 40px;}
.detail-band .badge{border-color:var(--gold-light);color:var(--gold-light);}
.back-link{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.06em;color:var(--gold-light);display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;}
.back-link:hover{color:var(--white);}

/* Sponsor tiers */
.sponsor-tier-head{display:flex;align-items:center;gap:14px;margin:44px 0 20px;}
.sponsor-tier-head:first-child{margin-top:0;}
.sponsor-tier-head .line{flex:1;height:1px;background:var(--line);}
.sponsor-card{background:var(--white);border:1px solid var(--line);padding:22px;text-align:center;}
.sponsor-card .logo-fallback{width:56px;height:56px;margin:0 auto 12px;background:var(--maroon);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:20px;}

/* Admin */
.admin-shell{display:grid;grid-template-columns:220px 1fr;min-height:70vh;gap:0;border:1px solid var(--line);background:var(--white);}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr;}}
.admin-sidenav{background:var(--ink);color:var(--cream);padding:22px 0;}
.admin-sidenav button{display:block;width:100%;text-align:left;background:none;border:none;color:#C9BFA9;padding:12px 22px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-left:3px solid transparent;}
.admin-sidenav button:hover{color:var(--gold-light);}
.admin-sidenav button.active{color:var(--gold-light);border-left-color:var(--gold);background:rgba(255,255,255,.04);}
.admin-main{padding:34px;}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.reg-item{border:1px solid var(--line);padding:18px;margin-bottom:14px;}
.reg-item .rtop{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;}
.reg-item .rname{font-family:'Anton';font-size:18px;text-transform:uppercase;}
.reg-item .rmeta{font-family:'JetBrains Mono';font-size:11.5px;color:#8a7f6e;margin-top:4px;}
.reg-item .ractions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn-approve{background:var(--green);color:var(--white);padding:8px 16px;border:none;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.btn-reject{background:#B0463C;color:var(--white);padding:8px 16px;border:none;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.btn-del{background:transparent;color:#B0463C;padding:8px 16px;border:1px solid #B0463C;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.btn-ghost{background:transparent;color:var(--ink);padding:8px 16px;border:1px solid var(--line);font-family:'JetBrains Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.thumb-link{font-family:'JetBrains Mono';font-size:11px;color:var(--maroon);text-decoration:underline;cursor:pointer;}
.player-id-tag{font-family:'JetBrains Mono';background:var(--gold);color:var(--ink);padding:5px 10px;font-size:12px;font-weight:700;letter-spacing:.05em;}
.empty-state{text-align:center;padding:60px 20px;color:#8a7f6e;}
.empty-state .em-icon{font-size:40px;margin-bottom:14px;}
.loading-dots{font-family:'JetBrains Mono';color:#8a7f6e;padding:40px;text-align:center;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,16,13,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--white);max-width:480px;width:100%;padding:30px;max-height:88vh;overflow:auto;}
.modal-box img{width:100%;border:1px solid var(--line);margin-top:12px;}
.close-x{float:right;background:none;border:none;font-size:20px;color:var(--ink);cursor:pointer;}
.stat-row{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:10px;}
.stat-box{background:var(--cream-dim);border:1px solid var(--line);padding:16px 20px;min-width:120px;}
.stat-box .n{font-family:'Anton';font-size:30px;color:var(--maroon);}
.stat-box .l{font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a7f6e;margin-top:4px;}
@media print{.topbar,.ticker-wrap,footer,.no-print{display:none;}}
</style>
</head>

<script>

/* ---------- Supabase client ----------
   Fill these in from Supabase Dashboard → Project Settings → API,
   then redeploy. See README.md for the full setup walkthrough. */
const SUPABASE_URL = 'https://dthbsvdvjjtdwfrjsaga.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0aGJzdmR2amp0ZHdmcmpzYWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTU2OTgsImV4cCI6MjEwMTc5MTY5OH0.QWyLlSNBf7shrTn76jUHxF_pyil28g2kWlsOMgJDlD0';
const CONFIG_READY = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
// Falls back to a harmless placeholder URL when not yet configured, so the
// Supabase client library doesn't throw at load time — render() below shows
// a friendly "add your keys" screen instead of a blank/broken page.
const sb = window.supabase.createClient(
  CONFIG_READY ? SUPABASE_URL : 'https://placeholder.supabase.co',
  CONFIG_READY ? SUPABASE_ANON_KEY : 'placeholder-anon-key'
);

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}

/* ---------- Generic table helpers ---------- */
async function tFetchAll(table, orderCol, ascending){
  const {data, error} = await sb.from(table).select('*').order(orderCol||'id', {ascending: !!ascending});
  if(error){ console.error(table, error); return []; }
  return data || [];
}
async function tInsert(table, row){
  // Deliberately does NOT chain .select().single() after insert: for
  // publicly-insertable tables (like registrations), anonymous visitors
  // have an INSERT policy but no SELECT policy, so asking Postgres to
  // read the row back would fail even though the write itself succeeded.
  const {error} = await sb.from(table).insert(row);
  if(error){ console.error(table, error); return {ok:false, error}; }
  return {ok:true};
}
async function tUpdate(table, id, patch){
  const {data, error} = await sb.from(table).update(patch).eq('id', id).select().single();
  if(error){ console.error(table, error); return {ok:false, error}; }
  return {ok:true, data};
}

/* ---------- Image handling: compress, then upload to Storage ---------- */
function compressImageToBlob(file, maxW=900, quality=0.62){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('toBlob failed')); return; }
          resolve({blob, dataUrl: canvas.toDataURL('image/jpeg', quality)});
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Uploads a compressed image to the given bucket, returns the storage path.
async function uploadImage(bucket, file, prefix, opts){
  const {blob} = await compressImageToBlob(file, bucket==='payment-screenshots'?1100:900, bucket==='payment-screenshots'?0.7:0.65);
  const path = (opts && opts.path) ? opts.path : `${prefix||'img'}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  // Replacing a fixed path (fixture boards, the payment QR) used to rely on
  // the client library's upsert:true option, but that started failing with
  // a 400 even though the RLS policies and bucket are correct — most likely
  // a regression in whatever @supabase/supabase-js@2 patch version the CDN
  // is now serving, since the version isn't pinned. Deleting first and then
  // doing a plain upload sidesteps the upsert flag entirely, so it isn't
  // exposed to that bug. The delete is expected to fail harmlessly the
  // first time a path is ever used (nothing there yet to delete).
  if(opts && opts.upsert){
    await sb.storage.from(bucket).remove([path]).catch(()=>{});
  }
  const {error} = await sb.storage.from(bucket).upload(path, blob, {contentType:'image/jpeg'});
  if(error){ console.error('upload failed', error); return null; }
  return path;
}
function publicUrl(bucket, path, bust){
  if(!path) return null;
  const {data} = sb.storage.from(bucket).getPublicUrl(path);
  return bust ? `${data.publicUrl}?t=${encodeURIComponent(bust)}` : data.publicUrl;
}
async function signedUrl(bucket, path, seconds){
  if(!path) return null;
  const {data, error} = await sb.storage.from(bucket).createSignedUrl(path, seconds||600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

function fmtDate(d){
  if(!d) return 'TBA';
  try{
    const dt = d.includes('T') ? new Date(d) : new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return d; }
}
function fmtDateTime(iso){
  try{ const dt = new Date(iso); return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ' · ' + dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function esc(str){
  const d = document.createElement('div'); d.innerText = (str==null?'':str); return d.innerHTML;
}
function toast(msg, type){
  const el = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className = 'msg-banner ' + (type||'info');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:999;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--white);animation:fadeUp .25s ease;';
  t.innerText = msg;
  el.appendChild(t);

}

/* =========================================================
   ANONYMOUS ANALYTICS (visitor-ID based)
   ========================================================= */
// Wrapped so a storage failure (private browsing, blocked storage, etc.)
// or a network failure can NEVER throw, block, or delay anything else on
// the site — including registration submission, which also tags itself
// with this ID for the admin funnel view. Analytics is best-effort only.
function getVisitorId(){
  try{
    let id = localStorage.getItem('plsf_visitor_id');
    if(!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('v_'+Date.now()+'_'+Math.random().toString(36).slice(2,10));
      localStorage.setItem('plsf_visitor_id', id);
    }
    return id;
  }catch(e){ return null; }
}
function logPageView(page){
  try{
    const visitorId = getVisitorId();
    if(!visitorId || !CONFIG_READY) return;
    sb.from('analytics_events').insert({visitor_id: visitorId, event_type:'pageview', page}).then(()=>{}, ()=>{});
    let today, lastHit;
    try{ today = new Date().toISOString().slice(0,10); lastHit = localStorage.getItem('plsf_last_hit_date'); }
    catch(e){ today = null; lastHit = null; }
    if(today && lastHit !== today){
      try{ localStorage.setItem('plsf_last_hit_date', today); }catch(e){}
      sb.from('analytics_events').insert({visitor_id: visitorId, event_type:'hit', page}).then(()=>{}, ()=>{});
    }
  }catch(e){ /* never let analytics break the site */ }
}

   team size for doubles/teams. A few events override this with a flat
   fee regardless of team size (see the event's own feeType:'flat') or a
   fee that varies by category but not by team size (feeType:'flatByCategory',
   used by Basketball). */
const CATEGORY_FEE_RATE = {
  'u10':  100,
  'u14':  100,
  '7-10': 100,
  'open': 200,
  '40-59': 200,
  '60+':  0,
};
function computeFee(ev, catId){
  if(ev.feeType === 'flat') return ev.fee;
  if(ev.feeType === 'flatByCategory') return (ev.feeByCategory && ev.feeByCategory[catId]!=null) ? ev.feeByCategory[catId] : (ev.fee||0);
  const rate = CATEGORY_FEE_RATE[catId];
  return (rate!=null ? rate : (ev.fee||0)) * ev.teamSize;
}

// Safe to do unconditionally here: it only fires right as a stale page

async function renderTicker(){
  const host = document.getElementById('tickerHost');
  if(!host) return;
  let updates = STATE.cache.updates;
  if(!updates.length) updates = await tFetchAll('updates', 'date', false);
  updates = updates.sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0,10);
  if(!updates.length){ host.innerHTML=''; return; }
  const items = updates.map(u=>`<span class="ticker-item" data-id="${u.id}"><span class="ticker-tag">${esc((u.category||'update').toUpperCase())}</span>${esc(u.title)}</span>`).join('');
  host.innerHTML = `
    <div class="ticker-wrap">
      <div class="ticker-label">📣 Latest</div>
      <div class="ticker-track"><div class="ticker-move">${items}${items}</div></div>
    </div>`;
  host.querySelectorAll('.ticker-item').forEach(el=>{
    el.addEventListener('click', ()=> navigate('updates', el.dataset.id));
  });
  // The CSS animation moves a fixed *percentage* of the track's own width
  // in a fixed *time* — so as more updates get added and the track gets
  // longer, the same duration covers more distance, making it look faster.
  // Setting the duration from the actual rendered width instead keeps the
  // scroll speed (pixels/second) constant no matter how much content there is.
  const moveEl = host.querySelector('.ticker-move');
  if(moveEl){
    const PIXELS_PER_SECOND = 60;
    const duration = moveEl.scrollWidth / PIXELS_PER_SECOND;
    moveEl.style.animationDuration = duration + 's';
  }
}

async function renderUpdatesList(highlightId){
  const host = document.getElementById('updatesList');

  host.innerHTML = list.map(u=>`

    el.addEventListener('click', ()=>{
      openModal(`<button class="close-x" id="modalClose">✕</button><img src="${el.dataset.full}">`);

}

<script>
/* =========================================================
   PAGE: REGISTER
   ========================================================= */
let REG_AUCTION_PHOTO_FILE = null; // holds the raw File for the basketball auction photo, uploaded at final confirm time

async function renderRegister(preSportId){
  renderShell(`
    <div class="detail-band">
      <div class="wrap">
        <div class="eyebrow" style="color:var(--gold-light)">Register</div>
        <h1 class="h-lg" style="color:var(--white)">Sign up for an event</h1>
        <p style="color:#EADFC8;margin-top:10px;max-width:560px;">Fill in your details and submit. If there's an entry fee, you'll get a payment QR code and can upload your screenshot right after — organisers verify each payment before your Player ID is issued.</p>
      </div>
    </div>
    <section class="wrap">
      <div class="grid" style="grid-template-columns:1fr;max-width:900px;gap:36px;">
        <div class="form-card" style="max-width:none;">
          <div class="field">
            <label>1. Choose your sport</label>
            <select id="regSportSelect">
              <option value="">— Select a sport —</option>
              ${SPORTS.filter(s=>s.registration.mode!=='onspot').map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}
            </select>
          </div>
          <div id="regDynamicArea"></div>
        </div>
        <div>
          <div class="card" style="margin-bottom:20px;">
            <div class="tag">Already registered?</div>
            <h3 style="font-size:18px;">Check your status</h3>
            <p style="margin-bottom:14px;">Look up your registration using the phone number you registered with.</p>
            <div class="field" style="margin-bottom:10px;"><input type="tel" id="statusPhoneInput" placeholder="10-digit phone number"></div>
            <button class="btn btn-dark btn-sm" id="statusCheckBtn">Check Status</button>
            <div id="statusResult" style="margin-top:16px;"></div>
          </div>
        </div>
      </div>
    </section>
  `);
  const sel = document.getElementById('regSportSelect');
  sel.addEventListener('change', ()=> renderRegDynamic(sel.value));
  document.getElementById('statusCheckBtn').addEventListener('click', ()=>checkRegStatus());
  if(preSportId){ sel.value = preSportId; renderRegDynamic(preSportId); }

function renderRegDynamic(sportId){
  const area = document.getElementById('regDynamicArea');
  if(!sportId){ area.innerHTML=''; return; }
  const s = getSport(sportId);
  if(s.registration.mode==='contact'){
    area.innerHTML = `<div class="msg-banner info" style="margin-top:20px;">Registration for ${s.name} isn't open yet — full details are coming soon. Contact the organisers to be notified first.</div>
    <a href="#contact" class="btn btn-outline btn-sm">Go to Contact</a>`;
    return;
  }
  if(s.registration.mode==='external'){
    area.innerHTML = `<div class="msg-banner info" style="margin-top:20px;">Registration for ${s.name} is handled through a separate form, not on this website.</div>
    <a href="${s.registration.externalUrl}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Register for ${s.name} ↗</a>`;
    return;
  }
  const cfg = s.registration;
  area.innerHTML = `
    <div class="field">
      <label>2. Category</label>
      <select id="regCategory">${cfg.categories.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select>
      <div class="hint" id="regCategoryHint"></div>
    </div>
    <div class="field">
      <label>3. Event</label>
      <select id="regEvent"></select>
    </div>
    <div id="regGenderWrap"></div>
    <div id="regParticipants"></div>
    <div id="regAuctionWrap"></div>
    <div class="form-grid-2">
      <div class="field"><label>Contact Phone Number *</label><input type="tel" id="regPhone" placeholder="10-digit mobile number" required maxlength="10"></div>
      <div class="field"><label>Flat Number *</label><input type="text" id="regFlat" placeholder="e.g. B-1204" required></div>
    </div>
    <div id="regPaymentArea"></div>
    <div id="regMsgArea"></div>
    <button class="btn btn-primary" id="regSubmitBtn" style="width:100%;justify-content:center;margin-top:10px;">Submit Registration</button>
  `;
  rebuildEventOptions(sportId);
  document.getElementById('regCategory').addEventListener('change', ()=>{ rebuildEventOptions(sportId); updateRegForm(sportId); });
  document.getElementById('regEvent').addEventListener('change', ()=>updateRegForm(sportId));
  updateRegForm(sportId);
  document.getElementById('regSubmitBtn').addEventListener('click', ()=>submitRegistration(sportId));
}

function getAllowedEvents(cfg, catId){
  if(cfg.eventsByCategory && cfg.eventsByCategory[catId]){
    return cfg.events.filter(e=>cfg.eventsByCategory[catId].includes(e.id));
  }
  return cfg.events;
}
function rebuildEventOptions(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const catId = document.getElementById('regCategory').value;
  const allowed = getAllowedEvents(cfg, catId);
  const evSel = document.getElementById('regEvent');
  const prevVal = evSel.value;
  evSel.innerHTML = allowed.map(e=>`<option value="${e.id}">${e.label}</option>`).join('');
  evSel.value = allowed.some(e=>e.id===prevVal) ? prevVal : allowed[0].id;
}

function currentEventConfig(sportId){
  const s = getSport(sportId);
  const evId = document.getElementById('regEvent').value;
  return s.registration.events.find(e=>e.id===evId) || s.registration.events[0];
}

async function updateRegForm(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const ev = currentEventConfig(sportId);
  const catSel = document.getElementById('regCategory');
  const isFree = computeFee(ev, catSel.value)===0;
  const teamSize = ev.teamSize;

  const catObj = cfg.categories.find(c=>c.id===catSel.value);
  const ageRule = AGE_CATEGORY_RULES[catSel.value];
  const hintEl = document.getElementById('regCategoryHint');
  if(ageRule){
    hintEl.textContent = ageRuleMessage(catObj?catObj.label:catSel.value, ageRule);
  }else if(cfg.categoryIsGender){
    hintEl.textContent = 'Register with your child\'s actual age — age-group heats will be announced on the day based on turnout.';
  }else{

        <label style="margin-bottom:12px;">🏀 Player Auction Details</label>
        <p class="hint" style="margin-top:-6px;margin-bottom:14px;">This helps the Sports Committee run the auction and build balanced teams. Your name, age and gender above are reused — no need to repeat them.</p>
        <div class="field">
          <label>Photo Upload *</label>
          <div class="upload-box" id="auctionPhotoBox"><p class="mono" style="font-size:12.5px;color:#8a7f6e;">📎 Click to upload a recent photo of yourself</p><input type="file" id="auctionPhotoInput" accept="image/*" style="display:none;"></div>
        </div>
        <div class="field">
          <label>Preferred Position of Play *</label>
          <select id="auctionPosition" required>
            <option value="">— Select a position —</option>
            <option value="Point Guard">Point Guard</option>
            <option value="Shooting Guard">Shooting Guard</option>
            <option value="Small Forward">Small Forward</option>
            <option value="Power Forward">Power Forward</option>
            <option value="Centre">Centre</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field" id="auctionPositionOtherWrap" style="display:none;">
          <label>Please specify *</label>
          <input type="text" id="auctionPositionOther" placeholder="Your preferred position">
        </div>
        <div class="field">
          <label>Playing Style *</label>
          <textarea id="auctionStyle" rows="2" placeholder="e.g. Scorer / Defender / Playmaker / Rebounder / All-rounder" required></textarea>

        <div class="field">
          <label>Special Talents *</label>

        <div class="field">
          <label>Willing to Participate in the Auction? *</label>
          <select id="auctionWilling" required>
            <option value="">— Select —</option>
            <option value="Yes">Yes</option>

          <label>Anything Else</label>
          <textarea id="auctionAnythingElse" rows="2" placeholder="Anything else you'd like the Sports Committee to know? (optional)"></textarea>

    const abox = document.getElementById('auctionPhotoBox');
    const ainput = document.getElementById('auctionPhotoInput');
    abox.addEventListener('click', ()=>ainput.click());
    ainput.addEventListener('change', async ()=>{
      const f = ainput.files[0]; if(!f) return;
      abox.innerHTML = `<p class="mono" style="font-size:12px;">Reading photo…</p>`;
      try{
        const {dataUrl} = await compressImageToBlob(f, 900, 0.7);
        REG_AUCTION_PHOTO_FILE = f;
        abox.classList.add('has-img');
        abox.innerHTML = `<img src="${dataUrl}" style="max-height:160px;margin:0 auto;"><p class="mono" style="font-size:11px;color:var(--green);margin-top:8px;">✓ Photo attached — click to replace</p>`;
        abox.addEventListener('click', ()=>ainput.click());
      }catch(e){
        abox.innerHTML = `<p class="mono" style="font-size:12px;color:#B0463C;">Couldn't read that image, please try again.</p>`;

    });
    document.getElementById('auctionPosition').addEventListener('change', e=>{
      document.getElementById('auctionPositionOtherWrap').style.display = e.target.value==='Other' ? 'block' : 'none';

  const payArea = document.getElementById('regPaymentArea');
  if(isFree){
    payArea.innerHTML = `<div class="msg-banner ok">This event is free to enter — no payment needed. Just submit the form below.</div>`;

    const feeAmount = computeFee(ev, catSel.value);
    payArea.innerHTML = `<div class="msg-banner info">Entry fee: ₹${feeAmount}. After you submit this form, you'll get a payment QR code and can upload your payment screenshot to finish registering.</div>`;
  }

async function renderPaymentQR(amount, sportName, hostId){
  const host = document.getElementById(hostId || 'qrHost');
  if(!host) return;
  const settings = await getSettings();
  if(!settings.upiId){
    host.innerHTML = `<p class="mono" style="font-size:12px;color:#B0463C;">Payment QR isn't configured yet. Please contact the organisers directly to pay for now.</p>`;
    return;
  }

  // Prefer the organisers' own bank-issued QR image, when one's been
  // uploaded in Settings. It only encodes the UPI ID — no amount, no
  // note — so it can't hit the same cross-bank compatibility issues a
  // generated collect-request QR sometimes runs into. The trade-off is
  // the amount isn't pre-filled, so it's shown in large text right next
  // to the QR with an explicit instruction to enter it manually.
  if(settings.paymentQrPath){
    const qrUrl = publicUrl('payment-qr', settings.paymentQrPath);
    host.innerHTML = `
      <img src="${qrUrl}" style="max-width:220px;border:1px solid var(--line);">
      <p class="mono" style="font-size:12px;margin-top:10px;">${esc(settings.upiId)}</p>
      <p class="mono" style="font-size:20px;font-weight:700;color:var(--maroon);margin-top:4px;">₹${amount}</p>
      <p class="mono" style="font-size:11.5px;color:#8a7f6e;margin-top:6px;max-width:240px;">⚠️ This QR doesn't include the amount — after scanning, type <strong>₹${amount}</strong> yourself before paying.</p>
    `;
    return;
  }

  // Fallback: generate a QR (used automatically until a static QR image
  // is uploaded in Settings). Some banks strictly expect the amount with
  // two decimal places and can mishandle a bare integer. The transaction
  // note is stripped down to plain letters/numbers/spaces — symbols like
  // the "+" in "3+1 Basketball" are technically valid once percent-encoded,
  // but not every bank's UPI parser handles them reliably. A short
  // transaction reference is also included, since some stricter bank-side
  // validators expect one on a collect request that specifies an amount.
  const cleanAmount = Number(amount).toFixed(2);
  const cleanNote = (sportName + ' registration').replace(/[^a-zA-Z0-9 ]/g, '').trim();
  const txnRef = 'PL26' + Date.now().toString(36).toUpperCase();
  const upiUrl = `upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent('Prateek Laurel Sports Fest')}&am=${cleanAmount}&cu=INR&tn=${encodeURIComponent(cleanNote)}&tr=${encodeURIComponent(txnRef)}`;
  host.innerHTML = `<canvas id="qrCanvas-${hostId||'qrHost'}"></canvas><p class="mono" style="font-size:12px;margin-top:10px;">${esc(settings.upiId)}</p><p class="mono" style="font-size:15px;font-weight:700;color:var(--maroon);">₹${amount}</p>`;
  try{
    new QRious({element: document.getElementById(`qrCanvas-${hostId||'qrHost'}`), value: upiUrl, size:200, foreground:'#201A17', background:'#FFFDF9'});
  }catch(e){ host.innerHTML += `<p class="mono" style="font-size:11px;color:#B0463C;">QR generation failed — pay via UPI ID above.</p>`; }
}

async function submitRegistration(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const ev = currentEventConfig(sportId);
  const catSel = document.getElementById('regCategory');
  const catObj = cfg.categories.find(c=>c.id===catSel.value);
  const feeAmount = computeFee(ev, catSel.value);
  const isFree = feeAmount===0;
  const msgArea = document.getElementById('regMsgArea');
  const phone = document.getElementById('regPhone').value.trim();
  const flat = document.getElementById('regFlat').value.trim();
  const names = [...document.querySelectorAll('.p-name')].map(i=>i.value.trim());
  const ages = [...document.querySelectorAll('.p-age')].map(i=>i.value.trim());
  const genders = [...document.querySelectorAll('.p-gender')].map(i=>i.value);
  const teamNameEl = document.getElementById('regTeamName');
  const requiredSize = ev.requiredSize || ev.teamSize;

  // Mandatory contact fields
  if(!/^\d{10}$/.test(phone)){ msgArea.innerHTML = `<div class="msg-banner err">Phone number is required — please enter a valid 10-digit number.</div>`; return; }
  if(!flat){ msgArea.innerHTML = `<div class="msg-banner err">Flat number is required.</div>`; return; }

  // Required player slots must be fully filled in
  for(let i=0;i<requiredSize;i++){
    if(!names[i] || !ages[i] || !genders[i]){
      msgArea.innerHTML = `<div class="msg-banner err">Please fill in name, age and gender for ${requiredSize>1?('Player '+(i+1)):'the participant'}.</div>`;
      return;
    }
  }
  // Optional slots (e.g. a substitute) — finish all three fields, or leave all three blank to skip
  for(let i=requiredSize;i<ev.teamSize;i++){
    const some = names[i] || ages[i] || genders[i];
    const all = names[i] && ages[i] && genders[i];
    if(some && !all){
      msgArea.innerHTML = `<div class="msg-banner err">Player ${i+1} is optional — please finish their name, age and gender, or leave all three blank to skip them.</div>`;
      return;
    }
  }

  // Carry forward only the slots that were actually filled in — this drops
  // a skipped optional substitute from the saved roster entirely.
  const participants = names.map((n,i)=>({name:n, age:ages[i], gender:genders[i]})).filter(p=>p.name && p.age && p.gender);
  const fNames = participants.map(p=>p.name);
  const fAges = participants.map(p=>p.age);
  const fGenders = participants.map(p=>p.gender);

  // Age vs category cross-check
  const ageRule = AGE_CATEGORY_RULES[catSel.value];
  if(ageRule){
    const bad = fAges.findIndex(a=>{ const n=Number(a); return (ageRule.min!=null && n<ageRule.min) || (ageRule.max!=null && n>ageRule.max); });
    if(bad!==-1){
      msgArea.innerHTML = `<div class="msg-banner err">${ageRuleMessage(catObj?catObj.label:catSel.value, ageRule)} — ${fNames.length>1?('Player '+(bad+1)+' ('+esc(fNames[bad])+')'):'this participant'} is ${fAges[bad]}.</div>`;
      return;
    }
  }

  // Gender vs category/event cross-check
  let requiredGender = null; // 'male' | 'female' | 'mixed' | null
  if(cfg.categoryIsGender){
    requiredGender = catSel.value==='boys' ? 'male' : 'female';
  }else if(ev.genderRule==='male' || ev.genderRule==='female' || ev.genderRule==='mixed'){
    requiredGender = ev.genderRule;
  }else if(ev.genderRule==='choose' || ev.genderRule==='chooseOrMixed'){
    const gcVal = document.getElementById('regGenderCat')?.value;
    requiredGender = gcVal==='boys' ? 'male' : gcVal==='girls' ? 'female' : gcVal==='mixed' ? 'mixed' : null;
  }
  if(requiredGender==='male' || requiredGender==='female'){
    const bad = fGenders.findIndex(g=>g!==requiredGender);
    if(bad!==-1){
      msgArea.innerHTML = `<div class="msg-banner err">This event requires all participants to be ${requiredGender} — ${fNames.length>1?('Player '+(bad+1)+' ('+esc(fNames[bad])+')'):'this participant'} is registered as ${fGenders[bad]||'unspecified'}. If this doesn't fit, please contact the organisers.</div>`;
      return;
    }
  }else if(requiredGender==='mixed'){
    const maleCount = fGenders.filter(g=>g==='male').length;
    const femaleCount = fGenders.filter(g=>g==='female').length;
    if(maleCount!==1 || femaleCount!==1){
      msgArea.innerHTML = `<div class="msg-banner err">Mixed doubles needs exactly one male and one female player.</div>`;
      return;
    }
  }

  // Player auction fields (Basketball Open individual registration only)
  let auctionInfo = null;
  if(ev.auctionFields){
    if(!REG_AUCTION_PHOTO_FILE){ msgArea.innerHTML = `<div class="msg-banner err">Please upload a recent photo of yourself.</div>`; return; }
    const position = document.getElementById('auctionPosition').value;
    const positionOther = document.getElementById('auctionPositionOther')?.value.trim() || '';
    const style = document.getElementById('auctionStyle').value.trim();
    const talents = document.getElementById('auctionTalents').value.trim();
    const willing = document.getElementById('auctionWilling').value;
    const preferred = document.getElementById('auctionPreferred').value.trim();
    const anythingElse = document.getElementById('auctionAnythingElse').value.trim();
    if(!position){ msgArea.innerHTML = `<div class="msg-banner err">Please select your preferred position of play.</div>`; return; }
    if(position==='Other' && !positionOther){ msgArea.innerHTML = `<div class="msg-banner err">Please specify your preferred position.</div>`; return; }
    if(!style){ msgArea.innerHTML = `<div class="msg-banner err">Please describe your playing style.</div>`; return; }
    if(!talents){ msgArea.innerHTML = `<div class="msg-banner err">Please share your special talents as a player.</div>`; return; }
    if(!willing){ msgArea.innerHTML = `<div class="msg-banner err">Please let us know if you're willing to participate in the auction.</div>`; return; }
    if(!preferred){ msgArea.innerHTML = `<div class="msg-banner err">Please fill in preferred player(s), or write "None" if you have no preference.</div>`; return; }
    auctionInfo = {
      position: position==='Other' ? positionOther : position,
      playing_style: style,
      special_talents: talents,
      auction_willing: willing,
      preferred_players: preferred,
      anything_else: anythingElse || null,
    };
  }

  // Duplicate check — same phone, same sport/category/event, still pending
  // or already approved. A prior rejection doesn't block a fresh attempt.
  const submitBtnForDupCheck = document.getElementById('regSubmitBtn');
  if(submitBtnForDupCheck){ submitBtnForDupCheck.disabled = true; submitBtnForDupCheck.textContent = 'Checking…'; }
  const {data: isDuplicate, error: dupError} = await sb.rpc('check_duplicate_registration', {
    p_phone: phone, p_sport_id: sportId, p_category_id: catSel.value, p_event_id: ev.id
  });
  if(submitBtnForDupCheck){ submitBtnForDupCheck.disabled = false; submitBtnForDupCheck.textContent = 'Submit Registration'; }
  if(dupError) console.error(dupError); // fail open — don't block submission on an infra hiccup
  if(isDuplicate){
    msgArea.innerHTML = `<div class="msg-banner err">Already Registered — <a href="#" id="dupStatusLink" style="text-decoration:underline;color:inherit;">Please Check Registration Status</a></div>`;
    document.getElementById('dupStatusLink')?.addEventListener('click', e=>{ e.preventDefault(); openStatusModal(phone); });
    return;
  }

  // All checks passed — build the registration row (payment fields added next)
  const baseRow = {
    sport_id: sportId, sport_name: s.name,
    category_id: catSel.value,
    event_id: ev.id, event_label: ev.label,
    gender_cat: document.getElementById('regGenderCat')?.value || null,
    team_name: teamNameEl ? teamNameEl.value.trim() : null,
    participants, phone, flat,
    fee: feeAmount,
    auction_info: auctionInfo,
    player_photo_path: null,
    visitor_id: getVisitorId(), // analytics only — never read or checked by any validation
  };

  if(isFree){
    baseRow.screenshot_path = null;
    baseRow.status = 'approved';
    baseRow.player_id = genPlayerId(s);
    await finalizeRegistration(baseRow, msgArea, true);
  }else{
    msgArea.innerHTML = '';
    openPaymentModal(s, feeAmount, baseRow, msgArea);
  }
}

// Saves the finished row to Supabase and updates the form's message area.
// Returns true on success so callers (e.g. the payment modal) know whether
// to close themselves.
async function finalizeRegistration(row, msgArea, isFree){
  const btn = document.getElementById('regSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Submitting…'; }
  const {ok} = await tInsert('registrations', row);
  if(btn){ btn.disabled = false; btn.textContent = 'Submit Registration'; }
  if(!ok){ msgArea.innerHTML = `<div class="msg-banner err">Something went wrong saving your registration. Please try again.</div>`; return false; }

  document.getElementById('regDynamicArea').querySelectorAll('input,select,button').forEach(el=>{ if(el.id!=='regSubmitBtn') el.disabled=true; });
  navigate('home');
  // Fired just after navigating so it lands on the Home page instead of
  // being wiped out along with the registration form it started on.
  setTimeout(()=>{
    toast(isFree ? `You're in! Player ID: ${row.player_id} — save this for event day.` : 'Registration submitted — organisers will verify your payment shortly.', 'ok');
  }, 150);
  return true;
}

// Shown after the form passes every check, for events with a fee: the QR
// code and screenshot upload live here instead of inline in the form, so
// the person only sees payment details once everything else is confirmed.
// Builds its own modal (rather than using the shared openModal helper) so
// closing it can be guarded — nothing is saved to the database until the
// Confirm button succeeds, so an accidental close must not happen silently.
function openPaymentModal(s, feeAmount, baseRow, msgArea){
  let modalFile = null;
  let saved = false;
  const host = document.getElementById('toast-host');
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = `<div class="modal-box">
    <button class="close-x" id="modalCloseBtn">✕</button>
    <h3 style="font-size:19px;">Complete Your Payment</h3>
    <p class="hint" style="margin-top:6px;">Scan and pay ₹${feeAmount} via UPI, then upload your payment screenshot to finish registering for ${esc(s.name)}. You can take a screenshot and pay, or scan the QR from another phone.</p>
    <div class="qr-box" id="qrHostModal" style="margin-top:14px;"><p class="mono" style="font-size:12px;color:#8a7f6e;">Loading payment QR…</p></div>
    <div class="field" style="margin-top:16px;">
      <label>Upload Payment Screenshot</label>
      <div class="upload-box" id="uploadBoxModal">
        <p class="mono" style="font-size:12.5px;color:#8a7f6e;">📎 Click to upload payment screenshot (JPG/PNG)</p>
        <input type="file" id="uploadInputModal" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="msg-banner info" style="margin-top:14px;margin-bottom:0;">⚠️ Your registration is <strong>not saved yet</strong> — it only saves once you upload your screenshot and press Confirm below.</div>
    <div id="modalPayMsg"></div>
    <button class="btn btn-primary" id="modalConfirmBtn" style="width:100%;justify-content:center;margin-top:16px;">Confirm &amp; Submit Registration</button>
  </div>`;
  host.appendChild(bd);

  function tryClose(){
    if(saved){ bd.remove(); return; }
    if(confirm("Close without finishing? Your registration has NOT been saved — you'll need to fill the form again from scratch if you close now.")){
      bd.remove();
    }
  }
  bd.addEventListener('click', e=>{ if(e.target===bd) tryClose(); });
  bd.querySelector('#modalCloseBtn').addEventListener('click', tryClose);

  renderPaymentQR(feeAmount, s.name, 'qrHostModal');

  const box = document.getElementById('uploadBoxModal');
  const input = document.getElementById('uploadInputModal');
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0]; if(!f) return;
    box.innerHTML = `<p class="mono" style="font-size:12px;">Reading screenshot…</p>`;
    try{
      const {dataUrl} = await compressImageToBlob(f, 1100, 0.7);
      modalFile = f;
      box.classList.add('has-img');
      box.innerHTML = `<img src="${dataUrl}" style="max-height:180px;margin:0 auto;"><p class="mono" style="font-size:11px;color:var(--green);margin-top:8px;">✓ Screenshot attached — click to replace</p>`;
      box.addEventListener('click', ()=>input.click());
    }catch(e){
      box.innerHTML = `<p class="mono" style="font-size:12px;color:#B0463C;">Couldn't read that image, please try again.</p>`;
    }
  });

  document.getElementById('modalConfirmBtn').addEventListener('click', async ()=>{
    const modalMsg = document.getElementById('modalPayMsg');
    if(!modalFile){ modalMsg.innerHTML = `<div class="msg-banner err">Please upload your payment screenshot first.</div>`; return; }
    const confirmBtn = document.getElementById('modalConfirmBtn');
    confirmBtn.disabled = true; confirmBtn.textContent = 'Submitting…';
    const screenshotPath = await uploadImage('payment-screenshots', modalFile, baseRow.sport_id);
    if(!screenshotPath){
      confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & Submit Registration';
      modalMsg.innerHTML = `<div class="msg-banner err">Couldn't upload your screenshot — please check your connection and try again.</div>`;
      return;
    }
    let playerPhotoPath = null;
    if(baseRow.auction_info){
      playerPhotoPath = await uploadImage('player-photos', REG_AUCTION_PHOTO_FILE, baseRow.sport_id);
      if(!playerPhotoPath){
        confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & Submit Registration';
        modalMsg.innerHTML = `<div class="msg-banner err">Couldn't upload your player photo — please check your connection and try again.</div>`;
        return;
      }
    }
    const row = {...baseRow, screenshot_path: screenshotPath, player_photo_path: playerPhotoPath, status:'pending', player_id: null};
    const ok = await finalizeRegistration(row, msgArea, false);
    if(ok){
      saved = true;
      bd.remove();
    }else{
      confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & Submit Registration';
      modalMsg.innerHTML = `<div class="msg-banner err">Something went wrong saving your registration. Please try again.</div>`;
    }
  });
}

function genPlayerId(sport){
  const code = sport.id.slice(0,4).toUpperCase();
  return 'PL26-' + code + '-' + Math.floor(1000+Math.random()*9000);
}

async function checkRegStatus(inputId, resultId){
  inputId = inputId || 'statusPhoneInput';
  resultId = resultId || 'statusResult';
  const phone = document.getElementById(inputId).value.trim();
  const host = document.getElementById(resultId);
  if(!phone){ host.innerHTML = `<div class="msg-banner err">Enter a phone number.</div>`; return; }
  host.innerHTML = `<div class="loading-dots">Checking…</div>`;
  const {data, error} = await sb.rpc('check_registration_status', {p_phone: phone});
  if(error){ host.innerHTML = `<div class="msg-banner err">Couldn't check status right now — please try again.</div>`; return; }
  if(!data || !data.length){ host.innerHTML = `<div class="msg-banner info">No registrations found for that number.</div>`; return; }
  host.innerHTML = data.map(r=>{
    let statusBlock;
    if(r.status==='approved'){
      statusBlock = `<div class="mono" style="font-size:11.5px;margin-top:6px;">Status: <span class="badge green">approved</span></div>
        <div style="margin-top:8px;"><span class="player-id-tag">${r.player_id}</span></div>`;
    }else if(r.status==='rejected'){
      statusBlock = `<div style="margin-top:8px;font-size:13.5px;line-height:1.75;">
        <div>❌ <strong>Could Not Be Verified</strong></div>
        <div>📞 Please Contact the Organisers</div>
      </div>`;
    }else{
      statusBlock = `<div style="margin-top:8px;font-size:13.5px;line-height:1.75;">
        <div>✅ <strong>Registration Complete</strong></div>
        <div>⏳ <strong>Verification Pending</strong></div>
        <div>📌 <strong>Check Back Later</strong> for your Player ID</div>
      </div>`;
    }
    const matchedSport = SPORTS.find(s=>s.name===r.sport_name);
    const catLabel = matchedSport?.registration.categories?.find(c=>c.id===r.category_id)?.label || r.category_id;
    const participantsLine = (r.participants||[]).map(p=>`${p.name} (${p.age}, ${p.gender})`).join(', ');
    const detailsLine = [
      catLabel ? `Category: ${catLabel}` : null,
      r.team_name ? `Team: ${r.team_name}` : null,
      participantsLine ? `Players: ${participantsLine}` : null,
    ].filter(Boolean).join(' · ');
    return `<div style="border:1px solid var(--line);padding:12px;margin-top:10px;background:var(--white);">
      <strong style="font-family:'Anton';text-transform:uppercase;">${esc(r.sport_name)} — ${esc(r.event_label)}</strong>
      ${detailsLine ? `<div style="font-size:12px;color:#8a7f6e;margin-top:6px;">${esc(detailsLine)}</div>` : ''}
      ${statusBlock}
    </div>`;
  }).join('');
}

function openStatusModal(prefillPhone){
  openModal(`
    <button class="close-x" id="modalClose">✕</button>
    <h3 style="font-size:19px;">Check Registration Status</h3>
    <p class="hint" style="margin-top:6px;margin-bottom:14px;">Look up your registration using the phone number you registered with.</p>
    <div class="field" style="margin-bottom:10px;"><input type="tel" id="statusPhoneInputModal" placeholder="10-digit phone number" value="${prefillPhone?esc(prefillPhone):''}"></div>
    <button class="btn btn-primary" id="statusCheckBtnModal" style="width:100%;justify-content:center;">Check Status</button>
    <div id="statusResultModal" style="margin-top:16px;"></div>
  `);
  document.getElementById('statusCheckBtnModal').addEventListener('click', ()=>checkRegStatus('statusPhoneInputModal','statusResultModal'));
  if(prefillPhone) checkRegStatus('statusPhoneInputModal','statusResultModal');
}

<script>
/* =========================================================
   PAGE: ADMIN
   ========================================================= */
async function renderAdmin(){
  const session = await currentAdminSession();
  STATE.adminAuthed = !!session;
  if(!STATE.adminAuthed){
    renderShell(`
      <section class="wrap" style="max-width:420px;padding-top:90px;padding-bottom:120px;">
        <div class="eyebrow">Organiser Login</div>
        <h1 class="h-md" style="margin-bottom:24px;">Sports Committee Backend</h1>
        <div class="form-card" style="max-width:none;padding:26px;">
          <div class="field"><label>Email</label><input type="email" id="adminEmail" placeholder="you@example.com"></div>
          <div class="field"><label>Password</label><input type="password" id="adminPass" placeholder="Enter password"></div>
          <div id="adminLoginMsg"></div>
          <button class="btn btn-primary" id="adminLoginBtn" style="width:100%;justify-content:center;">Log In</button>
          <p class="hint" style="margin-top:14px;">Organiser accounts are created in the Supabase dashboard — see README.md. There's no public sign-up.</p>

      else{ msg.innerHTML = `<div class="msg-banner err">${esc(error?.message || 'Could not sign in.')}</div>`; }

const ADMIN_SECTIONS = [
  {id:'registrations', label:'Registrations'},
  {id:'analytics', label:'Site Analytics'},
  {id:'updates', label:'Updates & Announcements'},
  {id:'fixtures', label:'Fixtures & Results'},
  {id:'sponsors', label:'Sponsorships'},
  {id:'photos', label:'Photos & Highlights'},
  {id:'settings', label:'Settings'},
];

async function renderAdminPanel(){
  renderShell(`
    <section class="wrap" style="padding-top:34px;">
      <div class="admin-toolbar">
        <div>
          <div class="eyebrow">Backend</div>
          <h1 class="h-md">Sports Committee Console</h1>
        </div>
        <button class="btn-ghost" id="adminLogoutBtn">Log Out</button>
      </div>
      <div class="admin-shell">
        <div class="admin-sidenav" id="adminSidenav">
          ${ADMIN_SECTIONS.map(s=>`<button data-sec="${s.id}" class="${STATE.adminSection===s.id?'active':''}">${s.label}</button>`).join('')}
        </div>
        <div class="admin-main" id="adminMain"><div class="loading-dots">Loading…</div></div>
      </div>
    </section>
  `);
  document.getElementById('adminLogoutBtn').addEventListener('click', async ()=>{ await adminSignOut(); STATE.adminAuthed=false; render(); });
  document.getElementById('adminSidenav').addEventListener('click', e=>{

    STATE.adminSection = btn.dataset.sec;
    document.querySelectorAll('#adminSidenav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadAdminSection();

  await loadAdminSection();
