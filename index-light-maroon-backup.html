async function loadAdminSection(){
  const map = {
    registrations: adminRegistrations,
    analytics: adminAnalytics,
    updates: adminUpdates,
    fixtures: adminFixtures,
    sponsors: adminSponsors,
    photos: adminPhotos,
    settings: adminSettings,
  };
  await map[STATE.adminSection]();
}

/* ---------- Admin: Registrations ---------- */
// Pulls every registration and builds a two-sheet Excel workbook: one row
// per registration (team-level) plus one row per individual participant,
// so organisers have both a quick overview and a full attendee list for
// event day. Runs entirely in the browser — no server involved.
async function exportRegistrationsExcel(){
  const btn = document.getElementById('exportExcelBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const all = await tFetchAll('registrations', 'submitted_at', false);
    if(!all.length){ toast('No registrations to export yet', 'info'); return; }

    // Signed URLs (7-day expiry) for every paid registration's screenshot —
    // the bucket is private, so there's no permanent public link to use.
    const withScreenshot = all.filter(r=>r.screenshot_path);
    const withPlayerPhoto = all.filter(r=>r.player_photo_path);
    if((withScreenshot.length || withPlayerPhoto.length) && btn) btn.textContent = `Preparing (${withScreenshot.length + withPlayerPhoto.length} links)…`;
    const screenshotUrls = {};
    await Promise.all(withScreenshot.map(async r=>{
      screenshotUrls[r.id] = await signedUrl('payment-screenshots', r.screenshot_path, 604800); // 7 days
    }));
    const playerPhotoUrls = {};
    await Promise.all(withPlayerPhoto.map(async r=>{
      playerPhotoUrls[r.id] = await signedUrl('player-photos', r.player_photo_path, 604800); // 7 days
    }));

    const regRows = all.map(r=>({
      'Submitted At': fmtDateTime(r.submitted_at),
      'Status': r.status,
      'Player ID': r.player_id || '',
      'Sport': r.sport_name,
      'Category': r.category_id,
      'Event': r.event_label,
      'Gender Category': r.gender_cat || '',
      'Team Name': r.team_name || '',
      'Fee (₹)': r.fee,
      'Phone': r.phone,
      'Flat': r.flat,
      'Participant Count': (r.participants||[]).length,
      'Participants': (r.participants||[]).map(p=>`${p.name} (${p.age}, ${p.gender})`).join('; '),
      'Payment Screenshot Link': r.screenshot_path ? (screenshotUrls[r.id] || 'Link unavailable') : 'N/A (free entry)',
      'Auction: Position': r.auction_info?.position || '',
      'Auction: Playing Style': r.auction_info?.playing_style || '',
      'Auction: Special Talents': r.auction_info?.special_talents || '',
      'Auction: Willing': r.auction_info?.auction_willing || '',
      'Auction: Preferred Player(s)': r.auction_info?.preferred_players || '',
      'Auction: Anything Else': r.auction_info?.anything_else || '',
      'Player Photo Link': r.player_photo_path ? (playerPhotoUrls[r.id] || 'Link unavailable') : '',
    }));

    const partRows = [];
    all.forEach(r=>{
      (r.participants||[]).forEach(p=>{
        partRows.push({
          'Player ID': r.player_id || '',
          'Status': r.status,
          'Sport': r.sport_name,
          'Category': r.category_id,
          'Event': r.event_label,
          'Participant Name': p.name,
          'Age': p.age,
          'Gender': p.gender,
          'Team Name': r.team_name || '',
          'Contact Phone': r.phone,
          'Flat': r.flat,
          'Submitted At': fmtDateTime(r.submitted_at),
        });
      });
    });

    const bySport = {};
    all.forEach(r=>{ bySport[r.sport_name] = (bySport[r.sport_name]||0) + 1; });
    const summaryRows = [
      {'Metric':'Total Registrations', 'Value': all.length},
      {'Metric':'Pending', 'Value': all.filter(r=>r.status==='pending').length},
      {'Metric':'Approved', 'Value': all.filter(r=>r.status==='approved').length},
      {'Metric':'Rejected', 'Value': all.filter(r=>r.status==='rejected').length},
      {'Metric':'Total Participants', 'Value': partRows.length},
      {'Metric':'—', 'Value':'—'},
      {'Metric':'Note', 'Value':'Payment screenshot links expire 7 days after export — re-download for fresh links.'},
      {'Metric':'—', 'Value':'—'},
      ...Object.entries(bySport).map(([sport,count])=>({'Metric':sport, 'Value':count})),
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(regRows), 'Registrations');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(partRows), 'Participants');
    const fname = `sports-fest-registrations-${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('Excel report downloaded', 'ok');
  }catch(e){
    console.error(e);
    toast('Could not build the report — try again', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '⬇ Download Excel Report'; }
  }
}

async function adminRegistrations(){
  const main = document.getElementById('adminMain');
  const selectedIds = new Set();
  const eligibleSports = SPORTS.filter(s=>s.registration.categories && s.registration.categories.length);
  main.innerHTML = `
    <div class="admin-toolbar" style="margin-bottom:0;">
      <div class="pill-tabs" id="regStatusPills" style="margin-bottom:0;">
        <button class="pill ${STATE.regFilter.status==='pending'?'active':''}" data-s="pending">Pending</button>
        <button class="pill ${STATE.regFilter.status==='approved'?'active':''}" data-s="approved">Approved</button>
        <button class="pill ${STATE.regFilter.status==='rejected'?'active':''}" data-s="rejected">Rejected</button>
        <button class="pill ${STATE.regFilter.status==='all'?'active':''}" data-s="all">All</button>
      </div>
      <button class="btn-dark btn-sm" id="exportExcelBtn">⬇ Download Excel Report</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
      <select id="regFilterSport" style="max-width:220px;">
        <option value="all">All Sports</option>
        ${eligibleSports.map(s=>`<option value="${s.id}" ${STATE.regFilter.sport===s.id?'selected':''}>${s.icon} ${s.name}</option>`).join('')}
      </select>
      <select id="regFilterCategory" style="max-width:200px;" ${STATE.regFilter.sport==='all'?'disabled':''}>
        <option value="all">All Categories</option>
      </select>
      <input type="text" id="regFilterSearch" placeholder="🔍 Search name, phone or flat…" style="flex:1;min-width:200px;" value="${esc(STATE.regFilter.search)}">
    </div>
    <div id="regStatsRow"></div>
    <div id="regBulkBar"></div>
    <div id="regListHost"><div class="loading-dots">Loading registrations…</div></div>
  `;
  main.querySelector('#regStatusPills').addEventListener('click', e=>{
    const b = e.target.closest('[data-s]'); if(!b) return;
    STATE.regFilter.status = b.dataset.s;
    adminRegistrations();
  });
  document.getElementById('exportExcelBtn').addEventListener('click', exportRegistrationsExcel);

  const sportSel = document.getElementById('regFilterSport');
  const catSel = document.getElementById('regFilterCategory');
  function rebuildCategoryOptions(){
    const sp = eligibleSports.find(s=>s.id===sportSel.value);
    if(!sp){ catSel.innerHTML = `<option value="all">All Categories</option>`; catSel.disabled = true; return; }
    catSel.disabled = false;
    catSel.innerHTML = `<option value="all">All Categories</option>` + sp.registration.categories.map(c=>`<option value="${c.id}" ${STATE.regFilter.category===c.id?'selected':''}>${c.label}</option>`).join('');
  }
  rebuildCategoryOptions();
  sportSel.addEventListener('change', ()=>{
    STATE.regFilter.sport = sportSel.value;
    STATE.regFilter.category = 'all';
    adminRegistrations();
  });
  catSel.addEventListener('change', ()=>{
    STATE.regFilter.category = catSel.value;
    adminRegistrations();
  });
  document.getElementById('regFilterSearch').addEventListener('input', e=>{
    STATE.regFilter.search = e.target.value;
    applyFiltersAndRenderList(); // re-filter in place, doesn't rebuild the input so focus/typing isn't interrupted
  });

  const all = await tFetchAll('registrations', 'submitted_at', false);
  STATE.cache.registrations = all;
  const counts = {pending:0, approved:0, rejected:0};
  all.forEach(r=>{ if(counts[r.status]!==undefined) counts[r.status]++; });
  document.getElementById('regStatsRow').innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="n">${counts.pending}</div><div class="l">Pending</div></div>
      <div class="stat-box"><div class="n">${counts.approved}</div><div class="l">Approved</div></div>
      <div class="stat-box"><div class="n">${all.length}</div><div class="l">Total</div></div>
    </div>`;

  const host = document.getElementById('regListHost');
  const bulkBar = document.getElementById('regBulkBar');
  let list = [];
  let showBulk = false;

  function computeFilteredList(){
    let l = STATE.regFilter.status==='all' ? all : all.filter(r=>r.status===STATE.regFilter.status);
    if(STATE.regFilter.sport!=='all') l = l.filter(r=>r.sport_id===STATE.regFilter.sport);
    if(STATE.regFilter.category!=='all') l = l.filter(r=>r.category_id===STATE.regFilter.category);
    const q = STATE.regFilter.search.trim().toLowerCase();
    if(q){
      l = l.filter(r=>{
        const nameMatch = (r.participants||[]).some(p=>(p.name||'').toLowerCase().includes(q));
        const phoneMatch = (r.phone||'').toLowerCase().includes(q);
        const flatMatch = (r.flat||'').toLowerCase().includes(q);
        return nameMatch || phoneMatch || flatMatch;
      });
    }
    return l;
  }

  function applyFiltersAndRenderList(){
  list = computeFilteredList();
  showBulk = STATE.regFilter.status==='pending' && list.length>0;

  function refreshBulkBar(){
    if(!showBulk){ bulkBar.innerHTML=''; return; }
    const n = selectedIds.size;
    bulkBar.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:12px;color:#8a7f6e;cursor:pointer;">
          <input type="checkbox" id="regSelectAll" style="width:auto;" ${n===list.length && list.length>0?'checked':''}> Select All Visible (${list.length})
        </label>
        <span class="mono" style="font-size:12px;color:#8a7f6e;">${n} selected</span>
        <button class="btn-approve" id="bulkApproveBtn" ${n===0?'disabled':''} style="${n===0?'opacity:.5;cursor:not-allowed;':''}">Approve Selected (${n})</button>
        <button class="btn-reject" id="bulkRejectBtn" ${n===0?'disabled':''} style="${n===0?'opacity:.5;cursor:not-allowed;':''}">Reject Selected (${n})</button>
      </div>`;
    document.getElementById('regSelectAll').addEventListener('change', e=>{
      if(e.target.checked){ list.forEach(r=>selectedIds.add(r.id)); }
      else{ selectedIds.clear(); }
      host.querySelectorAll('.reg-checkbox').forEach(cb=>{ cb.checked = selectedIds.has(cb.dataset.id); });
      refreshBulkBar();
    });
    if(n>0){
      document.getElementById('bulkApproveBtn').addEventListener('click', async ()=>{
        if(!confirm(`Approve ${n} selected registration${n>1?'s':''} and issue Player IDs?`)) return;
        const btn = document.getElementById('bulkApproveBtn'); btn.disabled=true; btn.textContent='Approving…';
        const results = await Promise.all([...selectedIds].map(async id=>{
          const r = all.find(x=>x.id===id);
          const sport = getSport(r.sport_id);
          return tUpdate('registrations', id, {status:'approved', player_id: genPlayerId(sport)});
        }));
        const failed = results.filter(r=>!r.ok).length;
        toast(failed ? `${results.length-failed} approved, ${failed} failed` : `${results.length} registrations approved`, failed?'err':'ok');
        adminRegistrations();
      });
      document.getElementById('bulkRejectBtn').addEventListener('click', async ()=>{
        if(!confirm(`Reject ${n} selected registration${n>1?'s':''}?`)) return;
        const btn = document.getElementById('bulkRejectBtn'); btn.disabled=true; btn.textContent='Rejecting…';
        const results = await Promise.all([...selectedIds].map(id=> tUpdate('registrations', id, {status:'rejected'})));
        const failed = results.filter(r=>!r.ok).length;
        toast(failed ? `${results.length-failed} rejected, ${failed} failed` : `${results.length} registrations rejected`, failed?'err':'ok');
        adminRegistrations();
      });
    }
  }

  if(!list.length){ host.innerHTML = `<div class="empty-state"><div class="em-icon">📋</div><p>Nothing here.</p></div>`; refreshBulkBar(); return; }
  host.innerHTML = list.map(r=>`
    <div class="reg-item" id="regitem-${r.id}">
      <div class="rtop">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          ${showBulk ? `<input type="checkbox" class="reg-checkbox" data-id="${r.id}" style="width:auto;margin-top:4px;">` : ''}
          <div>
            <div class="rname">${esc(r.sport_name)} — ${esc(r.event_label)}</div>
            <div class="rmeta">${r.participants.map(p=>esc(p.name)+' ('+esc(p.age)+', '+esc(p.gender)+')').join(' · ')}</div>
            <div class="rmeta">📞 ${esc(r.phone)} &nbsp;·&nbsp; 🏠 ${esc(r.flat)} ${r.team_name?(' · Team: '+esc(r.team_name)):''}</div>
            <div class="rmeta">Submitted ${fmtDateTime(r.submitted_at)} ${r.fee?(' · Fee ₹'+r.fee):' · Free entry'}</div>
          </div>
        </div>
        <span class="badge ${r.status==='approved'?'green':(r.status==='rejected'?'maroon':'gold')}">${r.status}</span>
      </div>
      ${r.screenshot_path ? `<div style="margin-top:10px;"><span class="thumb-link" data-view-shot="${r.id}">📎 View payment screenshot</span></div>` : ''}
      ${r.player_photo_path ? `<div style="margin-top:6px;"><span class="thumb-link" data-view-player-photo="${r.id}">🏀 View player photo</span></div>` : ''}
      ${r.auction_info ? `<div style="margin-top:10px;font-size:12.5px;color:#5a5148;background:var(--cream-dim);padding:10px 12px;border-left:3px solid var(--gold);">
        <strong style="color:var(--ink);">Position:</strong> ${esc(r.auction_info.position)}<br>
        <strong style="color:var(--ink);">Playing style:</strong> ${esc(r.auction_info.playing_style)}<br>
        <strong style="color:var(--ink);">Special talents:</strong> ${esc(r.auction_info.special_talents)}<br>
        <strong style="color:var(--ink);">Auction willing:</strong> ${esc(r.auction_info.auction_willing)}<br>
        <strong style="color:var(--ink);">Preferred player(s):</strong> ${esc(r.auction_info.preferred_players)}
        ${r.auction_info.anything_else ? `<br><strong style="color:var(--ink);">Anything else:</strong> ${esc(r.auction_info.anything_else)}` : ''}
      </div>` : ''}
      ${r.player_id ? `<div style="margin-top:10px;"><span class="player-id-tag">${r.player_id}</span></div>` : ''}
      <div class="ractions">
        ${r.status==='pending' ? `<button class="btn-approve" data-approve="${r.id}">Approve & Issue Player ID</button><button class="btn-reject" data-reject="${r.id}">Reject</button>` : ''}
        ${r.status==='approved' || r.status==='rejected' ? `<button class="btn-ghost" data-undo="${r.id}">↺ Undo — back to Pending</button>` : ''}
      </div>
    </div>`).join('');
  refreshBulkBar();
  host.querySelectorAll('.reg-checkbox').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedIds.add(cb.dataset.id); else selectedIds.delete(cb.dataset.id);
      refreshBulkBar();
    });
  });
  host.querySelectorAll('[data-view-shot]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = list.find(x=>x.id===el.dataset.viewShot);
      const url = await signedUrl('payment-screenshots', r.screenshot_path, 600);
      openModal(`<button class="close-x" id="modalClose">✕</button><h3 style="font-size:18px;">Payment Screenshot</h3>${url?`<img src="${url}">`:`<p>Couldn't load screenshot.</p>`}`);
    });
  });
  host.querySelectorAll('[data-view-player-photo]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = list.find(x=>x.id===el.dataset.viewPlayerPhoto);
      const url = await signedUrl('player-photos', r.player_photo_path, 600);
      openModal(`<button class="close-x" id="modalClose">✕</button><h3 style="font-size:18px;">Player Photo</h3>${url?`<img src="${url}">`:`<p>Couldn't load photo.</p>`}`);
    });
  });
  host.querySelectorAll('[data-approve]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = all.find(x=>x.id===el.dataset.approve);
      const sport = getSport(r.sport_id);
      const {ok} = await tUpdate('registrations', r.id, {status:'approved', player_id: genPlayerId(sport)});
      if(ok) toast('Registration approved — Player ID issued', 'ok'); else toast('Could not approve — try again', 'err');
      adminRegistrations();
    });
  });
  host.querySelectorAll('[data-reject]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = all.find(x=>x.id===el.dataset.reject);
      const {ok} = await tUpdate('registrations', r.id, {status:'rejected'});
      if(ok) toast('Registration rejected', 'info'); else toast('Could not reject — try again', 'err');
      adminRegistrations();
    });
  });
  host.querySelectorAll('[data-undo]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = all.find(x=>x.id===el.dataset.undo);
      const wasApproved = r.status==='approved';
      if(!confirm(`Undo this ${r.status}? It will go back to Pending${wasApproved?' and its Player ID will be cleared':''}.`)) return;
      const {ok} = await tUpdate('registrations', r.id, {status:'pending', player_id: null});
      if(ok) toast('Reverted to Pending', 'info'); else toast('Could not undo — try again', 'err');
      adminRegistrations();
    });
  });
  } // end applyFiltersAndRenderList

  applyFiltersAndRenderList();
}


/* ---------- Admin: Site Analytics ---------- */
async function adminAnalytics(){
  const main = document.getElementById('adminMain');
  main.innerHTML = `<div class="loading-dots">Loading analytics…</div>`;
  const events = await tFetchAll('analytics_events', 'created_at', false);
  const regs = await tFetchAll('registrations', 'submitted_at', false);

  if(!events.length){
    main.innerHTML = `<div class="empty-state"><div class="em-icon">📊</div><p>No visits recorded yet — data will start showing up once people visit the live site.</p></div>`;
    return;
  }

  const hits = events.filter(e=>e.event_type==='hit');
  const pageviews = events.filter(e=>e.event_type==='pageview');
  const uniqueVisitors = new Set(events.map(e=>e.visitor_id));
  const startedVisitors = new Set(pageviews.filter(e=>e.page==='register').map(e=>e.visitor_id));
  const completedVisitors = new Set(regs.filter(r=>r.visitor_id).map(r=>r.visitor_id));
  const startedButNotCompleted = [...startedVisitors].filter(id=>!completedVisitors.has(id)).length;
  const conversionRate = startedVisitors.size ? Math.round(100 * [...startedVisitors].filter(id=>completedVisitors.has(id)).length / startedVisitors.size) : 0;

  // Daily hits, last 14 days
  const byDate = {};
  hits.forEach(e=>{ const d = e.created_at.slice(0,10); byDate[d] = (byDate[d]||0)+1; });
  const last14 = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    last14.push({date:key, count: byDate[key]||0});
  }
  const maxDay = Math.max(1, ...last14.map(d=>d.count));

  // Page breakdown
  const byPage = {};
  pageviews.forEach(e=>{ const p = e.page||'(unknown)'; byPage[p] = (byPage[p]||0)+1; });
  const pageRows = Object.entries(byPage).sort((a,b)=>b[1]-a[1]);
  const maxPage = Math.max(1, ...pageRows.map(r=>r[1]));

  main.innerHTML = `
    <p class="hint" style="margin-bottom:20px;">Rough, anonymous estimates based on an ID stored in each visitor's browser — not exact unique-person counts, but close enough to spot trends. No names, phone numbers, or IP addresses are recorded.</p>
    <div class="stat-row" style="margin-bottom:28px;">
      <div class="stat-box"><div class="n">${hits.length}</div><div class="l">Total Hits</div></div>
      <div class="stat-box"><div class="n">${uniqueVisitors.size}</div><div class="l">Est. Unique Visitors</div></div>
      <div class="stat-box"><div class="n">${startedVisitors.size}</div><div class="l">Went to Register</div></div>
      <div class="stat-box"><div class="n">${completedVisitors.size}</div><div class="l">Completed a Registration</div></div>
      <div class="stat-box"><div class="n">${startedButNotCompleted}</div><div class="l">Started, Didn't Finish</div></div>
      <div class="stat-box"><div class="n">${conversionRate}%</div><div class="l">Conversion Rate</div></div>
    </div>

    <h3 class="h-md" style="margin-bottom:14px;">Hits — Last 14 Days</h3>
    <div style="margin-bottom:32px;">
      ${last14.map(d=>`
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          <div class="mono" style="width:78px;font-size:11px;color:#8a7f6e;flex:none;">${d.date.slice(5)}</div>
          <div style="flex:1;background:var(--cream-dim);height:16px;position:relative;border-radius:2px;overflow:hidden;">
            <div style="width:${Math.round(100*d.count/maxDay)}%;background:var(--gold);height:100%;"></div>
          </div>
          <div class="mono" style="width:30px;font-size:11px;color:#8a7f6e;text-align:right;flex:none;">${d.count}</div>
        </div>`).join('')}
    </div>

    <h3 class="h-md" style="margin-bottom:14px;">Page Views by Page</h3>
    <div>
      ${pageRows.map(([page,count])=>`
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          <div class="mono" style="width:110px;font-size:11px;color:#8a7f6e;flex:none;text-transform:capitalize;">${esc(page)}</div>
          <div style="flex:1;background:var(--cream-dim);height:16px;position:relative;border-radius:2px;overflow:hidden;">
            <div style="width:${Math.round(100*count/maxPage)}%;background:var(--green);height:100%;"></div>
          </div>
          <div class="mono" style="width:30px;font-size:11px;color:#8a7f6e;text-align:right;flex:none;">${count}</div>
        </div>`).join('')}
    </div>
  `;
}

  // Fest Overview — pure read-only computation from existing registration
  // data, nothing new stored. "Unique participants" is approximate: there's
  // no single ID per person, so it dedupes by name+age+gender, which means
  // two genuinely different people sharing an exact name/age/gender would
  // merge into one. Scope is Pending + Approved for both money and
  // participants — Rejected typically means the payment didn't go through
  // validly, so it's excluded from both.
  (async ()=>{
    const all = await tFetchAll('registrations', 'submitted_at', false);
    const counted = all.filter(r=>r.status==='pending' || r.status==='approved');
    const approvedOnly = all.filter(r=>r.status==='approved');

    const moneyCounted = counted.reduce((sum,r)=>sum+(r.fee||0), 0);
    const moneyApproved = approvedOnly.reduce((sum,r)=>sum+(r.fee||0), 0);

    function uniqueParticipantCount(regs){
      const seen = new Set();
      regs.forEach(r=>{
        (r.participants||[]).forEach(p=>{
          const key = `${(p.name||'').trim().toLowerCase()}|${p.age}|${(p.gender||'').trim().toLowerCase()}`;
          seen.add(key);
        });
      });
      return seen.size;
    }
    const uniqueAll = uniqueParticipantCount(counted);
    const uniqueExFieldGames = uniqueParticipantCount(counted.filter(r=>r.sport_id!=='field-games'));

    document.getElementById('festOverview').innerHTML = `
      <div class="stat-row">
        <div class="stat-box"><div class="n">₹${moneyCounted.toLocaleString('en-IN')}</div><div class="l">Money Collected</div></div>
        <div class="stat-box"><div class="n">${uniqueAll}</div><div class="l">Unique Participants (Whole Fest)</div></div>
        <div class="stat-box"><div class="n">${uniqueExFieldGames}</div><div class="l">Unique Participants (Excl. Field Games)</div></div>
      </div>
      <p class="hint" style="margin-top:10px;">Money and participant counts include Pending + Approved registrations (Rejected is excluded, since that payment likely didn't go through). Of the money collected, ₹${moneyApproved.toLocaleString('en-IN')} is from Approved registrations specifically. "Unique participants" is counted by name + age + gender across every registration — an approximation, since there's no single ID per person.</p>
    `;
  })();

  let qrFile = null;
  const qrBox = document.getElementById('setQrBox');
  const qrInput = document.getElementById('setQrInput');
  qrBox.addEventListener('click', ()=>qrInput.click());
  qrInput.addEventListener('change', async ()=>{
    const f = qrInput.files[0]; if(!f) return;
    const {dataUrl} = await compressImageToBlob(f, 700, 0.75);
    qrFile = f;
    qrBox.innerHTML = `<img src="${dataUrl}" style="max-height:180px;margin:0 auto;">`;
    qrBox.addEventListener('click', ()=>qrInput.click());
  });
  document.getElementById('setQrRemoveBtn')?.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(!confirm('Remove the QR image? The site will fall back to generating one automatically.')) return;
    if(s.paymentQrPath) await sb.storage.from('payment-qr').remove([s.paymentQrPath]);
    await saveSettings({paymentQrPath: null});
    toast('QR image removed', 'info');
    adminSettings();
  });
  document.getElementById('setSaveBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('setSaveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    let paymentQrPath = s.paymentQrPath;
    if(qrFile){
      const path = await uploadImage('payment-qr', qrFile, 'qr', {path:'main-qr.jpg', upsert:true});
      if(path) paymentQrPath = path;
      else { toast('QR image upload failed — try again', 'err'); btn.disabled=false; btn.textContent='Save Settings'; return; }
    }
    await saveSettings({upiId:document.getElementById('setUpi').value.trim(), paymentQrPath});
    btn.disabled = false; btn.textContent = 'Save Settings';
    document.getElementById('setMsg').innerHTML = `<div class="msg-banner ok" style="margin-top:14px;">Settings saved.</div>`;
    toast('Settings saved', 'ok');
  });
}
</script>
<script>
/* =========================================================
   MAIN ROUTER
   ========================================================= */
async function render(){
  if(!CONFIG_READY){
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--cream);padding:40px 20px;">
        <div style="max-width:520px;">
          <div class="eyebrow" style="color:var(--gold-light)">Setup needed</div>
          <h1 class="h-md" style="color:var(--white);">Connect Supabase to launch this site</h1>
          <p style="margin-top:14px;color:#C9BFA9;font-size:15px;line-height:1.6;">
            Open <code style="background:#000;padding:2px 6px;">index.html</code>, find <code style="background:#000;padding:2px 6px;">SUPABASE_URL</code> and
            <code style="background:#000;padding:2px 6px;">SUPABASE_ANON_KEY</code> near the top of the script, and paste in the values from your
            Supabase project's <strong>Settings → API</strong> page. See README.md for the full walkthrough.
          </p>
        </div>
      </div>`;
    return;
  }
  const {route, param} = parseHash();
  STATE.route = route;
  STATE.params = {param};
  window.scrollTo(0,0);
  logPageView(route); // fire-and-forget, never awaited — cannot delay or break rendering
  try{
    switch(route){
      case 'home': await renderHome(); break;
      case 'sports': await renderSportsIndex(); break;
      case 'sport': await renderSportDetail(param); break;
      case 'schedule': await renderSchedule(); break;
      case 'rules': await renderRulesIndex(); break;
      case 'fixtures': await renderFixtures(); break;
      case 'updates': await renderUpdates(param); break;
      case 'sponsors': await renderSponsors(); break;
      case 'contact': await renderContact(); break;
      case 'register': await renderRegister(param); break;
      case 'admin': await renderAdmin(); break;
      default: await renderHome();
    }
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="wrap" style="padding:80px 0;text-align:center;"><h2 class="h-md">Something went wrong loading this page.</h2><p style="margin-top:10px;"><a href="#home" style="color:var(--maroon);">Return home →</a></p></div>`;
  }
}

render();
</script>
</body>
</html>
