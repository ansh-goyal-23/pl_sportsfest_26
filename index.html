<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prateek Laurel Sports Fest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0F1B2D;
  --ink:#0B141F;
  --white:#16273D;
  --cream-dim:#1C2E47;
  --cream:#F5F3EC;
  --bright:#F5F3EC;
  --gold:#E8A33D;
  --gold-light:#F0B356;
  --maroon:#F0917C;
  --maroon-dark:#9C3620;
  --clay:#C1442D;
  --green:#8FD6B0;
  --green-deep:#1F5B3F;
  --slate:#93A0B0;
  --line:rgba(245,243,236,0.14);
  --radius:4px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--navy);
  color:var(--bright);
  font-family:'Work Sans',sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--ink);}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.02em;
  line-height:1.02;
  margin:0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ===== Lane divider pattern ===== */
.lane-rule{
  height:5px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 26px, transparent 26px 34px);
  opacity:.55;
}
.lane-rule.gold{background:repeating-linear-gradient(90deg,var(--clay) 0 26px, transparent 26px 34px);}

/* ===== Topbar / Nav ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(15,27,45,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:34px;height:34px;flex:none;}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-text .b1{font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:.05em;color:var(--bright);text-transform:uppercase;}
.brand-text .b2{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;color:var(--slate);margin-top:3px;}
nav.mainnav{display:flex;gap:2px;flex-wrap:wrap;}
nav.mainnav a{
  font-family:'Oswald';font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 14px;color:var(--slate);border-radius:var(--radius);
  transition:.15s;white-space:nowrap;
}
nav.mainnav a:hover{color:var(--bright);background:var(--cream-dim);}
nav.mainnav a.active{color:var(--ink);background:var(--gold);font-weight:600;}
nav.mainnav a.nav-cta{color:var(--clay);font-weight:600;}
nav.mainnav a.nav-cta:hover{color:var(--maroon-dark);background:var(--cream-dim);}
nav.mainnav a.nav-cta.active{color:var(--ink);background:var(--gold);}
.nav-toggle{display:none;background:none;border:1px solid var(--line);color:var(--bright);padding:8px 10px;border-radius:var(--radius);}
@media(max-width:940px){
  nav.mainnav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--ink);flex-direction:column;padding:6px 12px 14px;border-top:1px solid var(--line);}
  nav.mainnav.open{display:flex;}
  nav.mainnav a{padding:11px 6px;border-bottom:1px solid var(--line);border-radius:0;}
  .nav-toggle{display:block;}
}

/* ===== Ticker ===== */
.ticker-wrap{
  background:var(--cream-dim);color:var(--bright);
  display:flex;align-items:stretch;overflow:hidden;
  border-bottom:1px solid var(--line);
}
.ticker-label{
  flex:none;background:var(--gold);color:var(--ink);
  font-family:'IBM Plex Mono';font-size:11px;font-weight:600;letter-spacing:.1em;
  padding:8px 14px;display:flex;align-items:center;gap:6px;
}
.ticker-track{flex:1;overflow:hidden;position:relative;white-space:nowrap;display:flex;align-items:center;}
.ticker-move{display:inline-flex;padding-left:100%;animation:tickmove 32s linear infinite;}
.ticker-move:hover{animation-play-state:paused;}
@keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ticker-item{
  font-family:'IBM Plex Mono';font-size:12.5px;padding:8px 34px 8px 0;cursor:pointer;
  border-right:1px dashed var(--line);margin-right:34px;color:var(--slate);
}
.ticker-item:hover{color:var(--gold-light);}
.ticker-tag{color:var(--gold-light);margin-right:8px;}

/* ===== Layout helpers ===== */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
section{padding:64px 0;}
.eyebrow{
  font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--gold);}
.h-xl{font-size:clamp(38px,6.5vw,76px);font-weight:700;}
.h-lg{font-size:clamp(28px,4.2vw,46px);font-weight:600;}
.h-md{font-size:clamp(21px,2.8vw,28px);font-weight:600;}
.sub{font-size:16px;line-height:1.65;color:var(--slate);max-width:640px;}

/* ===== Hero ===== */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 85% 0%, rgba(31,91,63,0.45), transparent 55%),
    radial-gradient(circle at 8% 95%, rgba(232,163,61,0.16), transparent 45%),
    var(--navy);
  border-bottom:1px solid var(--line);
}
.hero-inner{max-width:1180px;margin:0 auto;padding:76px 20px 60px;position:relative;z-index:2;}
.hero-dates{
  display:inline-flex;align-items:center;gap:10px;font-family:'IBM Plex Mono';
  font-size:12.5px;letter-spacing:.06em;color:var(--slate);border:1px solid var(--line);
  padding:7px 14px;margin-bottom:26px;border-radius:20px;
}
.hero h1{color:var(--bright);}
.hero h1 .accent{color:var(--gold);}
.hero-lede{max-width:560px;color:var(--slate);font-size:16px;line-height:1.7;margin-top:22px;}
.hero-ctas{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 24px;font-family:'Oswald';font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:var(--radius);transition:.15s;background:transparent;color:var(--bright);
}
.btn-primary{background:var(--gold);color:var(--ink);font-weight:600;border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-light);}
.btn-outline{border-color:var(--line);color:var(--bright);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-light);}
.btn-dark{background:var(--cream-dim);color:var(--bright);border-color:var(--line);}
.btn-dark:hover{border-color:var(--gold);}
.btn-sm{padding:9px 16px;font-size:11.5px;}
.hero-track{position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top, rgba(15,27,45,0.6), transparent);}
.wreath-decor{position:absolute;right:-40px;top:-40px;width:380px;height:380px;opacity:.10;z-index:1;}

/* ===== Cards ===== */
.grid{display:grid;gap:18px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
  transition:.18s;position:relative;
}
.card:hover{border-color:var(--gold);}
.card .tag{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.09em;color:var(--gold);text-transform:uppercase;}
.card h3{font-size:21px;margin-top:8px;}
.card p{color:var(--slate);font-size:14.5px;line-height:1.55;margin-top:10px;}
.sport-card{cursor:pointer;overflow:hidden;padding:0;}
.card-cover{height:118px;position:relative;overflow:hidden;}
.card-cover svg{position:absolute;inset:0;width:100%;height:100%;transition:.3s;}
.sport-card:hover .card-cover svg{transform:scale(1.06);}
.card-content{position:relative;z-index:1;padding:20px 22px 22px;}
.cv-freedom-run{background:linear-gradient(135deg,#F4A340,#E8613D);}
.cv-field-games{background:linear-gradient(135deg,#4FA8E0,#2F6FBF);}
.cv-basketball{background:linear-gradient(135deg,#3F7FA8,#1F5B7A);}
.cv-lawn-tennis{background:linear-gradient(135deg,#8BC34A,#2F6B3F);}
.cv-badminton{background:linear-gradient(135deg,#C1442D,#7A2418);}
.cv-table-tennis{background:linear-gradient(135deg,#2F6FBF,#1B3A66);}
.cv-chess{background:linear-gradient(135deg,#2B2B3D,#565676);}
.cv-carrom{background:linear-gradient(135deg,#D9A441,#9C6B1F);}
.cv-pool{background:linear-gradient(135deg,#1F5B3F,#123324);}
.cv-football{background:linear-gradient(135deg,#3FA34D,#1F6B2E);}
.sport-card .meta{display:flex;gap:14px;margin-top:14px;font-family:'IBM Plex Mono';font-size:11px;color:var(--slate);flex-wrap:wrap;}
.sport-card .meta span{display:flex;align-items:center;gap:5px;}

.badge{
  display:inline-block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;
  padding:4px 11px;border-radius:20px;text-transform:uppercase;
}
.badge.gold{background:rgba(232,163,61,0.18);color:var(--gold-light);}
.badge.maroon{background:rgba(193,68,45,0.22);color:var(--maroon);}
.badge.green{background:rgba(31,91,63,0.35);color:var(--green);}
.badge.grey{background:rgba(147,160,176,0.16);color:var(--slate);}

/* ===== Timeline ===== */
.timeline{position:relative;margin-top:40px;padding-left:28px;border-left:1px solid var(--line);}
.tl-item{position:relative;padding-bottom:34px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-33px;top:2px;width:12px;height:12px;background:var(--gold);border:3px solid var(--navy);border-radius:50%;}
.tl-date{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.tl-item h4{font-family:'Oswald';font-size:18px;font-weight:600;text-transform:uppercase;color:var(--bright);}
.tl-item p{color:var(--slate);font-size:14px;margin-top:5px;max-width:560px;}

/* ===== Footer ===== */
footer{background:var(--ink);color:var(--slate);padding:52px 0 26px;margin-top:40px;border-top:1px solid var(--line);}
footer h4{color:var(--gold-light);font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
footer .fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;}
@media(max-width:700px){footer .fgrid{grid-template-columns:1fr;}}
footer a.flink{display:block;padding:5px 0;font-size:13.5px;color:var(--slate);}
footer a.flink:hover{color:var(--gold-light);}
.footer-bottom{border-top:1px solid var(--line);margin-top:36px;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--slate);}
.footer-bottom a{color:var(--slate);}
.footer-bottom a:hover{color:var(--gold-light);}

/* ===== Forms ===== */
.field{margin-bottom:18px;}
.field label{display:block;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);margin-bottom:7px;}
.field .hint{font-size:12px;color:var(--slate);margin-top:5px;}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=password],select,textarea,input[type=date],input[type=time],input[type=url]{
  width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--navy);border-radius:var(--radius);
  font-family:'Work Sans';font-size:14.5px;color:var(--bright);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
textarea{resize:vertical;min-height:90px;}
.form-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:32px;max-width:680px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.form-grid-2{grid-template-columns:1fr;}}
.upload-box{border:1px dashed var(--slate);border-radius:var(--radius);padding:22px;text-align:center;background:var(--cream-dim);cursor:pointer;}
.upload-box:hover{border-color:var(--gold);}
.upload-box.has-img{padding:14px;}
.qr-box{background:var(--cream-dim);border:1px dashed var(--slate);border-radius:var(--radius);padding:20px;text-align:center;}
.msg-banner{padding:14px 18px;font-size:14px;margin-bottom:20px;border-radius:var(--radius);border:1px solid transparent;}
.msg-banner.ok{background:rgba(31,91,63,0.28);border-color:var(--green-deep);color:var(--green);}
.msg-banner.err{background:rgba(193,68,45,0.2);border-color:var(--clay);color:var(--maroon);}
.msg-banner.info{background:rgba(232,163,61,0.14);border-color:var(--gold);color:var(--gold-light);}

/* ===== Table / list rows ===== */
.data-row{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);}
@media(max-width:700px){.data-row{grid-template-columns:1fr;gap:8px;}}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;}
.filter-bar select,.filter-bar input{width:auto;min-width:160px;}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
.pill{padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.04em;background:var(--white);text-transform:uppercase;color:var(--slate);}
.pill.active{background:var(--green-deep);color:var(--bright);border-color:var(--green-deep);}

/* ===== Section headers with dividers ===== */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:20px;flex-wrap:wrap;}

/* ===== Rules content ===== */
.rules-block{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--radius);padding:26px 28px;}
.rules-block h4{font-family:'Oswald';font-size:15px;font-weight:600;text-transform:uppercase;color:var(--gold-light);margin:24px 0 10px;letter-spacing:.03em;}
.rules-block h4:first-child{margin-top:0;}
.rules-block ul{margin:0 0 14px;padding-left:20px;}
.rules-block li{margin-bottom:6px;font-size:14.5px;line-height:1.6;color:var(--slate);}
.rules-block table{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:13.5px;}
.rules-block th,.rules-block td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
.rules-block th{background:var(--cream-dim);font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);}
.rules-block td{color:var(--bright);}
.rules-block p{font-size:14.5px;line-height:1.6;color:var(--slate);}

/* ===== Detail page hero band ===== */
.detail-band{
  background:
    radial-gradient(circle at 90% 10%, rgba(232,163,61,0.16), transparent 50%),
    var(--cream-dim);
  color:var(--bright);padding:52px 0 64px;border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
.detail-band .badge{background:rgba(232,163,61,0.16);color:var(--gold-light);}
.back-link{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.05em;color:var(--gold-light);display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;}
.back-link:hover{color:var(--bright);}

/* Sponsor tiers */
.sponsor-tier-head{display:flex;align-items:center;gap:14px;margin:44px 0 20px;}
.sponsor-tier-head:first-child{margin-top:0;}
.sponsor-tier-head .line{flex:1;height:1px;background:var(--line);}
.sponsor-tier-head h3{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
.sponsor-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;}
.sponsor-card .logo-fallback{width:56px;height:56px;margin:0 auto 12px;background:var(--navy);color:var(--bright);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:20px;}

/* Admin */
.admin-shell{display:grid;grid-template-columns:220px 1fr;min-height:70vh;gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);overflow:hidden;}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr;}}
.admin-sidenav{background:var(--ink);padding:22px 0;}
.admin-sidenav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--slate);padding:12px 22px;font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.05em;text-transform:uppercase;border-left:3px solid transparent;}
.admin-sidenav button:hover{color:var(--bright);}
.admin-sidenav button.active{color:var(--gold-light);border-left-color:var(--gold);background:rgba(232,163,61,0.06);}
.admin-main{padding:32px;}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.reg-item{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;background:var(--white);}
.reg-item .rtop{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;}
.reg-item .rname{font-family:'Oswald';font-size:17px;font-weight:600;text-transform:uppercase;color:var(--bright);}
.reg-item .rmeta{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--slate);margin-top:4px;}
.reg-item .ractions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn-approve{background:var(--green-deep);color:var(--bright);padding:8px 16px;border:none;border-radius:var(--radius);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
.btn-approve:hover{background:#276e4c;}
.btn-reject{background:var(--clay);color:var(--bright);padding:8px 16px;border:none;border-radius:var(--radius);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
.btn-reject:hover{background:#a83a26;}
.btn-del{background:transparent;color:var(--maroon);padding:8px 16px;border:1px solid var(--clay);border-radius:var(--radius);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
.btn-ghost{background:var(--cream-dim);color:var(--bright);padding:8px 16px;border:1px solid var(--line);border-radius:var(--radius);font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
.thumb-link{font-family:'IBM Plex Mono';font-size:11px;color:var(--gold-light);text-decoration:underline;cursor:pointer;}
.player-id-tag{font-family:'IBM Plex Mono';background:var(--gold);color:var(--ink);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.04em;}
.empty-state{text-align:center;padding:60px 20px;color:var(--slate);}
.empty-state .em-icon{font-size:40px;margin-bottom:14px;}
.loading-dots{font-family:'IBM Plex Mono';color:var(--slate);padding:40px;text-align:center;}
.modal-backdrop{position:fixed;inset:0;background:rgba(11,20,31,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);max-width:480px;width:100%;padding:30px;max-height:88vh;overflow:auto;}
.modal-box img{width:100%;border:1px solid var(--line);border-radius:var(--radius);margin-top:12px;}
.close-x{float:right;background:none;border:none;font-size:20px;color:var(--slate);cursor:pointer;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.stat-box{background:var(--cream-dim);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;min-width:120px;}
.stat-box .n{font-family:'Oswald';font-weight:700;font-size:30px;color:var(--gold);}
.stat-box .l{font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);margin-top:4px;}
@media print{.topbar,.ticker-wrap,footer,.no-print{display:none;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   PRATEEK LAUREL SPORTS FEST 2026 — SITE ENGINE
   ========================================================= */

/* ---------- Supabase client ----------

/* ---------- Generic table helpers ---------- */
async function tFetchAll(table, orderCol, ascending){
  const {data, error} = await sb.from(table).select('*').order(orderCol||'id', {ascending: !!ascending});
  if(error){ console.error(table, error); return []; }
  return data || [];
}
async function tInsert(table, row){
  // Deliberately does NOT chain .select().single() after insert: for
  // publicly-insertable tables (like registrations), anonymous visitors
  // have an INSERT policy but no SELECT policy, so asking Postgres to
  // read the row back would fail even though the write itself succeeded.
  const {error} = await sb.from(table).insert(row);
  if(error){ console.error(table, error); return {ok:false, error}; }
  return {ok:true};
}
async function tUpdate(table, id, patch){
  const {data, error} = await sb.from(table).update(patch).eq('id', id).select().single();
  if(error){ console.error(table, error); return {ok:false, error}; }
  return {ok:true, data};
}
async function tDelete(table, id){
  const {error} = await sb.from(table).delete().eq('id', id);
  if(error){ console.error(table, error); return false; }
  return true;
}

/* ---------- Image handling: compress, then upload to Storage ---------- */
function compressImageToBlob(file, maxW=900, quality=0.62){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('toBlob failed')); return; }
          resolve({blob, dataUrl: canvas.toDataURL('image/jpeg', quality)});
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Uploads a compressed image to the given bucket, returns the storage path.
async function uploadImage(bucket, file, prefix, opts){
  const {blob} = await compressImageToBlob(file, bucket==='payment-screenshots'?1100:900, bucket==='payment-screenshots'?0.7:0.65);
  const path = (opts && opts.path) ? opts.path : `${prefix||'img'}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error} = await sb.storage.from(bucket).upload(path, blob, {contentType:'image/jpeg', upsert: !!(opts && opts.upsert)});
  if(error){ console.error('upload failed', error); return null; }
  return path;
}
function publicUrl(bucket, path, bust){
  if(!path) return null;
  const {data} = sb.storage.from(bucket).getPublicUrl(path);
  return bust ? `${data.publicUrl}?t=${encodeURIComponent(bust)}` : data.publicUrl;
}
async function signedUrl(bucket, path, seconds){
  if(!path) return null;
  const {data, error} = await sb.storage.from(bucket).createSignedUrl(path, seconds||600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}

/* ---------- Formatting helpers ---------- */
function fmtDate(d){
  if(!d) return 'TBA';
  try{
    const dt = d.includes('T') ? new Date(d) : new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return d; }
}
function fmtDateTime(iso){
  try{ const dt = new Date(iso); return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ' · ' + dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function esc(str){
  const d = document.createElement('div'); d.innerText = (str==null?'':str); return d.innerHTML;
}
function toast(msg, type){
  const el = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className = 'msg-banner ' + (type||'info');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:999;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--white);animation:fadeUp .25s ease;';
  t.innerText = msg;
  el.appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}

/* Age bounds implied by each category, keyed by category id (shared
   across sports since the ids mean the same thing everywhere they
   appear). Categories not listed here (e.g. "open", "boys"/"girls")
   have no enforced age bound. */
const AGE_CATEGORY_RULES = {
  'u10':  {max:10},
  'u14':  {max:14},
  '7-10': {min:7, max:10},
  '60+':  {min:60},
};
function ageRuleMessage(catLabel, rule){
  if(rule.min!=null && rule.max!=null) return `${catLabel} needs an age between ${rule.min} and ${rule.max}`;
  if(rule.max!=null) return `${catLabel} needs an age of ${rule.max} or under`;
  if(rule.min!=null) return `${catLabel} needs an age of ${rule.min} or above`;
  return '';
}

/* Per-person registration fee by age category, shared across every sport
   except Basketball (which is a flat fee per team regardless of category —
   see the event's own feeType:'flat'). A doubles/team entry is this rate
   × the number of participants. */
const CATEGORY_FEE_RATE = {
  'u10':  100,
  'u14':  100,
  '7-10': 100,
  'open': 200,
  '60+':  0,
};
function computeFee(ev, catId){
  if(ev.feeType === 'flat') return ev.fee;
  if(ev.feeType === 'flatByCategory') return (ev.feeByCategory && ev.feeByCategory[catId]!=null) ? ev.feeByCategory[catId] : (ev.fee||0);
  const rate = CATEGORY_FEE_RATE[catId];
  return (rate!=null ? rate : (ev.fee||0)) * ev.teamSize;
}

            const genderLabel = b.gender ? ` — ${FIXTURE_GENDER_LABELS[b.gender]||b.gender}` : '';
            const url = publicUrl('fixture-boards', b.image_path, b.updated_at);
            return `<div class="card fixture-board-card" data-full="${url}" style="padding:0;overflow:hidden;cursor:pointer;">
              <div style="padding:14px 16px;border-bottom:1px solid var(--line);">
                <strong style="font-family:'Oswald';text-transform:uppercase;font-size:14.5px;">${esc(catLabel)}${genderLabel}</strong>
              </div>
              <img src="${url}" style="width:100%;display:block;">
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
  host.querySelectorAll('[data-full]').forEach(el=>{
    el.addEventListener('click', ()=>{
      openModal(`<button class="close-x" id="modalClose">✕</button><img src="${el.dataset.full}">`);
    });
  });
}

const UPDATE_CATS = ['announcement','schedule-change','result','important-info','photo-highlight'];
const UPDATE_CAT_LABEL = {
  'announcement':'Announcement','schedule-change':'Schedule Change','result':'Result',
  'important-info':'Important Info','photo-highlight':'Photo / Highlight'
};

async function renderUpdates(highlightId){
  renderShell(`

      <div class="wrap">
        <div class="eyebrow" style="color:var(--gold-light)">Updates</div>
        <h1 class="h-lg" style="color:var(--bright)">Announcements &amp; news</h1>

  `);
  document.getElementById('updatePills').addEventListener('click', e=>{

    document.querySelectorAll('#updatePills .pill').forEach(p=>p.classList.remove('active'));

async function renderUpdatesList(highlightId){
  const host = document.getElementById('updatesList');
  if(!host) return;
  let list = await tFetchAll('updates', 'date', false);
  STATE.cache.updates = list;
  if(STATE.updatesFilter!=='all') list = list.filter(u=>u.category===STATE.updatesFilter);
  list.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || new Date(b.date)-new Date(a.date));
  if(!list.length){
    host.innerHTML = `<div class="empty-state"><div class="em-icon">📭</div><p>No updates in this category yet.</p></div>`;
    return;
  }
  host.innerHTML = list.map(u=>`
    <div class="card" id="upd-${u.id}" style="margin-bottom:16px;${highlightId===u.id?'border-color:var(--gold);box-shadow:0 0 0 3px rgba(192,138,46,.25);':''}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span class="badge ${u.category==='result'?'green':(u.category==='schedule-change'?'maroon':'gold')}">${UPDATE_CAT_LABEL[u.category]||u.category}</span>
        <span class="mono" style="font-size:11.5px;color:var(--slate);">${fmtDate(u.date)}</span>
      </div>
      <h3 style="margin-top:12px;font-size:20px;">${esc(u.title)}</h3>
      <p style="white-space:pre-wrap;">${esc(u.body)}</p>
    </div>`).join('');
  if(highlightId){
    const el = document.getElementById('upd-'+highlightId);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

<script>
/* =========================================================
   PAGE: REGISTER
   ========================================================= */
async function renderRegister(preSportId){
  renderShell(`
    <div class="detail-band">
      <div class="wrap">
        <div class="eyebrow" style="color:var(--gold-light)">Register</div>
        <h1 class="h-lg" style="color:var(--bright)">Sign up for an event</h1>
        <p style="color:var(--slate);margin-top:10px;max-width:560px;">Fill in your details and submit. If there's an entry fee, you'll get a payment QR code and can upload your screenshot right after — organisers verify each payment before your Player ID is issued.</p>
      </div>
    </div>
    <section class="wrap">
      <div class="grid" style="grid-template-columns:1fr;max-width:900px;gap:36px;">
        <div class="form-card" style="max-width:none;">
          <div class="field">
            <label>1. Choose your sport</label>
            <select id="regSportSelect">
              <option value="">— Select a sport —</option>
              ${SPORTS.filter(s=>s.registration.mode!=='onspot').map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}
            </select>
          </div>
          <div id="regDynamicArea"></div>
        </div>
        <div>
          <div class="card" style="margin-bottom:20px;">
            <div class="tag">Already registered?</div>
            <h3 style="font-size:18px;">Check your status</h3>
            <p style="margin-bottom:14px;">Look up your registration using the phone number you registered with.</p>
            <div class="field" style="margin-bottom:10px;"><input type="tel" id="statusPhoneInput" placeholder="10-digit phone number"></div>
            <button class="btn btn-dark btn-sm" id="statusCheckBtn">Check Status</button>
            <div id="statusResult" style="margin-top:16px;"></div>
          </div>
        </div>
      </div>
    </section>
  `);
  const sel = document.getElementById('regSportSelect');
  sel.addEventListener('change', ()=> renderRegDynamic(sel.value));
  document.getElementById('statusCheckBtn').addEventListener('click', checkRegStatus);
  if(preSportId){ sel.value = preSportId; renderRegDynamic(preSportId); }
}

function renderRegDynamic(sportId){
  const area = document.getElementById('regDynamicArea');
  if(!sportId){ area.innerHTML=''; return; }
  const s = getSport(sportId);
  if(s.registration.mode==='contact'){
    area.innerHTML = `<div class="msg-banner info" style="margin-top:20px;">Registration for ${s.name} isn't open yet — full details are coming soon. Contact the organisers to be notified first.</div>
    <a href="#contact" class="btn btn-outline btn-sm">Go to Contact</a>`;
    return;
  }
  const cfg = s.registration;
  area.innerHTML = `
    <div class="field">
      <label>2. Category</label>
      <select id="regCategory">${cfg.categories.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select>
      <div class="hint" id="regCategoryHint"></div>
    </div>
    <div class="field">
      <label>3. Event</label>
      <select id="regEvent"></select>
    </div>
    <div id="regGenderWrap"></div>
    <div id="regParticipants"></div>
    <div class="form-grid-2">
      <div class="field"><label>Contact Phone Number *</label><input type="tel" id="regPhone" placeholder="10-digit mobile number" required maxlength="10"></div>
      <div class="field"><label>Flat Number *</label><input type="text" id="regFlat" placeholder="e.g. B-1204" required></div>
    </div>
    <div id="regPaymentArea"></div>
    <div id="regMsgArea"></div>
    <button class="btn btn-primary" id="regSubmitBtn" style="width:100%;justify-content:center;margin-top:10px;">Submit Registration</button>
  `;
  rebuildEventOptions(sportId);
  document.getElementById('regCategory').addEventListener('change', ()=>{ rebuildEventOptions(sportId); updateRegForm(sportId); });
  document.getElementById('regEvent').addEventListener('change', ()=>updateRegForm(sportId));
  updateRegForm(sportId);
  document.getElementById('regSubmitBtn').addEventListener('click', ()=>submitRegistration(sportId));
}

function getAllowedEvents(cfg, catId){
  if(cfg.eventsByCategory && cfg.eventsByCategory[catId]){
    return cfg.events.filter(e=>cfg.eventsByCategory[catId].includes(e.id));
  }
  return cfg.events;
}
function rebuildEventOptions(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const catId = document.getElementById('regCategory').value;
  const allowed = getAllowedEvents(cfg, catId);
  const evSel = document.getElementById('regEvent');
  const prevVal = evSel.value;
  evSel.innerHTML = allowed.map(e=>`<option value="${e.id}">${e.label}</option>`).join('');
  evSel.value = allowed.some(e=>e.id===prevVal) ? prevVal : allowed[0].id;
}

function currentEventConfig(sportId){
  const s = getSport(sportId);
  const evId = document.getElementById('regEvent').value;
  return s.registration.events.find(e=>e.id===evId) || s.registration.events[0];
}

async function updateRegForm(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const ev = currentEventConfig(sportId);
  const catSel = document.getElementById('regCategory');
  const isFree = computeFee(ev, catSel.value)===0;
  const teamSize = ev.teamSize;

  const catObj = cfg.categories.find(c=>c.id===catSel.value);
  const ageRule = AGE_CATEGORY_RULES[catSel.value];
  const hintEl = document.getElementById('regCategoryHint');
  if(ageRule){
    hintEl.textContent = ageRuleMessage(catObj?catObj.label:catSel.value, ageRule);
  }else if(cfg.categoryIsGender){
    hintEl.textContent = 'Register with your child\'s actual age — age-group heats will be announced on the day based on turnout.';
  }else{
    hintEl.textContent = '';
  }

  const genderWrap = document.getElementById('regGenderWrap');
  if(cfg.categoryIsGender){
    genderWrap.innerHTML = `<p class="hint" style="margin-bottom:14px;">Registering under <strong>${esc(catObj?catObj.label:catSel.value)}</strong> — every participant below should be ${catSel.value==='boys'?'male':'female'}.</p>`;
  }else if(ev.genderRule==='choose'){
    genderWrap.innerHTML = `<div class="field"><label>Gender Category</label><select id="regGenderCat"><option value="boys">Male</option><option value="girls">Female</option></select></div>`;
  }else if(ev.genderRule==='chooseOrMixed'){
    const mixedOk = !ev.mixedCategories || ev.mixedCategories.includes(catSel.value);
    genderWrap.innerHTML = `<div class="field"><label>Gender Category</label><select id="regGenderCat"><option value="boys">Male</option><option value="girls">Female</option>${mixedOk?'<option value="mixed">Mixed (one of each)</option>':''}</select></div>`;
  }else if(ev.genderRule==='male'||ev.genderRule==='female'){
    genderWrap.innerHTML = `<p class="hint" style="margin-bottom:14px;">${ev.label} — participants must be ${ev.genderRule}.</p>`;
  }else if(ev.genderRule==='mixed'){
    genderWrap.innerHTML = `<p class="hint" style="margin-bottom:14px;">${ev.label} — needs exactly one male and one female player.</p>`;
  }else{
    genderWrap.innerHTML = '';
  }

  const pWrap = document.getElementById('regParticipants');
  let fields = '';
  if(teamSize>1){
    fields += `<div class="field"><label>Team Name</label><input type="text" id="regTeamName" placeholder="Give your team a name"></div>`;
  }
  const requiredSize = ev.requiredSize || teamSize;
  for(let i=0;i<teamSize;i++){
    const isOptional = i>=requiredSize;
    fields += `
      <div class="field-group" style="border:1px solid var(--line);padding:14px;margin-bottom:14px;background:var(--cream-dim);">
        <label style="margin-bottom:10px;">${teamSize>1?('Player '+(i+1)):'Participant'} Details${isOptional?' <span class="mono" style="color:var(--slate);text-transform:none;letter-spacing:0;">(optional substitute)</span>':''}</label>
        <div class="form-grid-2">
          <div class="field" style="margin-bottom:10px;"><input type="text" class="p-name" placeholder="Full name" ${isOptional?'':'required'}></div>
          <div class="field" style="margin-bottom:10px;"><input type="number" class="p-age" placeholder="Age" min="1" max="99" ${isOptional?'':'required'}></div>
        </div>
        <select class="p-gender"><option value="">Gender</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
      </div>`;
  }
  pWrap.innerHTML = fields;

  const payArea = document.getElementById('regPaymentArea');
  if(isFree){
    payArea.innerHTML = `<div class="msg-banner ok">This event is free to enter — no payment needed. Just submit the form below.</div>`;
  }else{
    const feeAmount = computeFee(ev, catSel.value);
    payArea.innerHTML = `<div class="msg-banner info">Entry fee: ₹${feeAmount}. After you submit this form, you'll get a payment QR code and can upload your payment screenshot to finish registering.</div>`;
  }
}

async function renderPaymentQR(amount, sportName, hostId){
  const host = document.getElementById(hostId || 'qrHost');
  if(!host) return;
  const settings = await getSettings();
  if(!settings.upiId){
    host.innerHTML = `<p class="mono" style="font-size:12px;color:var(--maroon);">Payment QR isn't configured yet. Please contact the organisers directly to pay for now.</p>`;
    return;
  }
  const upiUrl = `upi://pay?pa=${encodeURIComponent(settings.upiId)}&pn=${encodeURIComponent('Prateek Laurel Sports Fest')}&am=${amount}&cu=INR&tn=${encodeURIComponent(sportName+' registration')}`;
  host.innerHTML = `<canvas id="qrCanvas-${hostId||'qrHost'}"></canvas><p class="mono" style="font-size:12px;margin-top:10px;">${esc(settings.upiId)}</p><p class="mono" style="font-size:15px;font-weight:700;color:var(--maroon);">₹${amount}</p>`;
  try{
    new QRious({element: document.getElementById(`qrCanvas-${hostId||'qrHost'}`), value: upiUrl, size:200, foreground:'#0B141F', background:'#F5F3EC'});
  }catch(e){ host.innerHTML += `<p class="mono" style="font-size:11px;color:var(--maroon);">QR generation failed — pay via UPI ID above.</p>`; }
}

async function submitRegistration(sportId){
  const s = getSport(sportId);
  const cfg = s.registration;
  const ev = currentEventConfig(sportId);
  const catSel = document.getElementById('regCategory');
  const catObj = cfg.categories.find(c=>c.id===catSel.value);
  const feeAmount = computeFee(ev, catSel.value);
  const isFree = feeAmount===0;
  const msgArea = document.getElementById('regMsgArea');
  const phone = document.getElementById('regPhone').value.trim();
  const flat = document.getElementById('regFlat').value.trim();
  const names = [...document.querySelectorAll('.p-name')].map(i=>i.value.trim());
  const ages = [...document.querySelectorAll('.p-age')].map(i=>i.value.trim());
  const genders = [...document.querySelectorAll('.p-gender')].map(i=>i.value);
  const teamNameEl = document.getElementById('regTeamName');
  const requiredSize = ev.requiredSize || ev.teamSize;

  // Mandatory contact fields
  if(!/^\d{10}$/.test(phone)){ msgArea.innerHTML = `<div class="msg-banner err">Phone number is required — please enter a valid 10-digit number.</div>`; return; }
  if(!flat){ msgArea.innerHTML = `<div class="msg-banner err">Flat number is required.</div>`; return; }

  // Required player slots must be fully filled in
  for(let i=0;i<requiredSize;i++){
    if(!names[i] || !ages[i] || !genders[i]){
      msgArea.innerHTML = `<div class="msg-banner err">Please fill in name, age and gender for ${requiredSize>1?('Player '+(i+1)):'the participant'}.</div>`;
      return;
    }
  }
  // Optional slots (e.g. a substitute) — finish all three fields, or leave all three blank to skip
  for(let i=requiredSize;i<ev.teamSize;i++){
    const some = names[i] || ages[i] || genders[i];
    const all = names[i] && ages[i] && genders[i];
    if(some && !all){
      msgArea.innerHTML = `<div class="msg-banner err">Player ${i+1} is optional — please finish their name, age and gender, or leave all three blank to skip them.</div>`;
      return;
    }
  }

  // Carry forward only the slots that were actually filled in — this drops
  // a skipped optional substitute from the saved roster entirely.
  const participants = names.map((n,i)=>({name:n, age:ages[i], gender:genders[i]})).filter(p=>p.name && p.age && p.gender);
  const fNames = participants.map(p=>p.name);
  const fAges = participants.map(p=>p.age);
  const fGenders = participants.map(p=>p.gender);

  // Age vs category cross-check
  const ageRule = AGE_CATEGORY_RULES[catSel.value];
  if(ageRule){
    const bad = fAges.findIndex(a=>{ const n=Number(a); return (ageRule.min!=null && n<ageRule.min) || (ageRule.max!=null && n>ageRule.max); });
    if(bad!==-1){
      msgArea.innerHTML = `<div class="msg-banner err">${ageRuleMessage(catObj?catObj.label:catSel.value, ageRule)} — ${fNames.length>1?('Player '+(bad+1)+' ('+esc(fNames[bad])+')'):'this participant'} is ${fAges[bad]}.</div>`;
      return;
    }
  }

  // Gender vs category/event cross-check
  let requiredGender = null; // 'male' | 'female' | 'mixed' | null
  if(cfg.categoryIsGender){
    requiredGender = catSel.value==='boys' ? 'male' : 'female';
  }else if(ev.genderRule==='male' || ev.genderRule==='female' || ev.genderRule==='mixed'){
    requiredGender = ev.genderRule;
  }else if(ev.genderRule==='choose' || ev.genderRule==='chooseOrMixed'){
    const gcVal = document.getElementById('regGenderCat')?.value;
    requiredGender = gcVal==='boys' ? 'male' : gcVal==='girls' ? 'female' : gcVal==='mixed' ? 'mixed' : null;
  }
  if(requiredGender==='male' || requiredGender==='female'){
    const bad = fGenders.findIndex(g=>g!==requiredGender);
    if(bad!==-1){
      msgArea.innerHTML = `<div class="msg-banner err">This event requires all participants to be ${requiredGender} — ${fNames.length>1?('Player '+(bad+1)+' ('+esc(fNames[bad])+')'):'this participant'} is registered as ${fGenders[bad]||'unspecified'}. If this doesn't fit, please contact the organisers.</div>`;
      return;
    }
  }else if(requiredGender==='mixed'){
    const maleCount = fGenders.filter(g=>g==='male').length;
    const femaleCount = fGenders.filter(g=>g==='female').length;
    if(maleCount!==1 || femaleCount!==1){
      msgArea.innerHTML = `<div class="msg-banner err">Mixed doubles needs exactly one male and one female player.</div>`;
      return;
    }
  }

  // All checks passed — build the registration row (payment fields added next)
  const baseRow = {
    sport_id: sportId, sport_name: s.name,
    category_id: catSel.value,
    event_id: ev.id, event_label: ev.label,
    gender_cat: document.getElementById('regGenderCat')?.value || null,
    team_name: teamNameEl ? teamNameEl.value.trim() : null,
    participants, phone, flat,
    fee: feeAmount,
  };

  if(isFree){
    baseRow.screenshot_path = null;
    baseRow.status = 'approved';
    baseRow.player_id = genPlayerId(s);
    await finalizeRegistration(baseRow, msgArea, true);
  }else{
    msgArea.innerHTML = '';
    openPaymentModal(s, feeAmount, baseRow, msgArea);
  }
}

// Saves the finished row to Supabase and updates the form's message area.
// Returns true on success so callers (e.g. the payment modal) know whether
// to close themselves.
async function finalizeRegistration(row, msgArea, isFree){
  const btn = document.getElementById('regSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Submitting…'; }
  const {ok} = await tInsert('registrations', row);
  if(btn){ btn.disabled = false; btn.textContent = 'Submit Registration'; }
  if(!ok){ msgArea.innerHTML = `<div class="msg-banner err">Something went wrong saving your registration. Please try again.</div>`; return false; }

  document.getElementById('regDynamicArea').querySelectorAll('input,select,button').forEach(el=>{ if(el.id!=='regSubmitBtn') el.disabled=true; });
  navigate('home');
  // Fired just after navigating so it lands on the Home page instead of
  // being wiped out along with the registration form it started on.
  setTimeout(()=>{
    toast(isFree ? `You're in! Player ID: ${row.player_id} — save this for event day.` : 'Registration submitted — organisers will verify your payment shortly.', 'ok');
  }, 150);
  return true;
}

// Shown after the form passes every check, for events with a fee: the QR
// code and screenshot upload live here instead of inline in the form, so
// the person only sees payment details once everything else is confirmed.
// Builds its own modal (rather than using the shared openModal helper) so
// closing it can be guarded — nothing is saved to the database until the
// Confirm button succeeds, so an accidental close must not happen silently.
function openPaymentModal(s, feeAmount, baseRow, msgArea){
  let modalFile = null;
  let saved = false;
  const host = document.getElementById('toast-host');
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = `<div class="modal-box">
    <button class="close-x" id="modalCloseBtn">✕</button>
    <h3 style="font-size:19px;">Complete Your Payment</h3>
    <p class="hint" style="margin-top:6px;">Scan and pay ₹${feeAmount} via UPI, then upload your payment screenshot to finish registering for ${esc(s.name)}. You can take a screenshot and pay, or scan the QR from another phone.</p>
    <div class="qr-box" id="qrHostModal" style="margin-top:14px;"><p class="mono" style="font-size:12px;color:var(--slate);">Loading payment QR…</p></div>
    <div class="field" style="margin-top:16px;">
      <label>Upload Payment Screenshot</label>
      <div class="upload-box" id="uploadBoxModal">
        <p class="mono" style="font-size:12.5px;color:var(--slate);">📎 Click to upload payment screenshot (JPG/PNG)</p>
        <input type="file" id="uploadInputModal" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="msg-banner info" style="margin-top:14px;margin-bottom:0;">⚠️ Your registration is <strong>not saved yet</strong> — it only saves once you upload your screenshot and press Confirm below.</div>
    <div id="modalPayMsg"></div>
    <button class="btn btn-primary" id="modalConfirmBtn" style="width:100%;justify-content:center;margin-top:16px;">Confirm &amp; Submit Registration</button>
  </div>`;
  host.appendChild(bd);

  function tryClose(){
    if(saved){ bd.remove(); return; }
    if(confirm("Close without finishing? Your registration has NOT been saved — you'll need to fill the form again from scratch if you close now.")){
      bd.remove();
    }
  }
  bd.addEventListener('click', e=>{ if(e.target===bd) tryClose(); });
  bd.querySelector('#modalCloseBtn').addEventListener('click', tryClose);

  renderPaymentQR(feeAmount, s.name, 'qrHostModal');

  const box = document.getElementById('uploadBoxModal');
  const input = document.getElementById('uploadInputModal');
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0]; if(!f) return;
    box.innerHTML = `<p class="mono" style="font-size:12px;">Reading screenshot…</p>`;
    try{
      const {dataUrl} = await compressImageToBlob(f, 1100, 0.7);
      modalFile = f;
      box.classList.add('has-img');
      box.innerHTML = `<img src="${dataUrl}" style="max-height:180px;margin:0 auto;"><p class="mono" style="font-size:11px;color:var(--green);margin-top:8px;">✓ Screenshot attached — click to replace</p>`;
      box.addEventListener('click', ()=>input.click());
    }catch(e){
      box.innerHTML = `<p class="mono" style="font-size:12px;color:var(--maroon);">Couldn't read that image, please try again.</p>`;
    }
  });

  document.getElementById('modalConfirmBtn').addEventListener('click', async ()=>{
    const modalMsg = document.getElementById('modalPayMsg');
    if(!modalFile){ modalMsg.innerHTML = `<div class="msg-banner err">Please upload your payment screenshot first.</div>`; return; }
    const confirmBtn = document.getElementById('modalConfirmBtn');
    confirmBtn.disabled = true; confirmBtn.textContent = 'Submitting…';
    const screenshotPath = await uploadImage('payment-screenshots', modalFile, baseRow.sport_id);
    if(!screenshotPath){
      confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & Submit Registration';
      modalMsg.innerHTML = `<div class="msg-banner err">Couldn't upload your screenshot — please check your connection and try again.</div>`;
      return;
    }
    const row = {...baseRow, screenshot_path: screenshotPath, status:'pending', player_id: null};
    const ok = await finalizeRegistration(row, msgArea, false);
    if(ok){
      saved = true;
      bd.remove();
    }else{
      confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & Submit Registration';
      modalMsg.innerHTML = `<div class="msg-banner err">Something went wrong saving your registration. Please try again.</div>`;
    }
  });
}

function genPlayerId(sport){
  const code = sport.id.slice(0,4).toUpperCase();
  return 'PL26-' + code + '-' + Math.floor(1000+Math.random()*9000);
}

async function checkRegStatus(){

}

// Pulls every registration and builds a two-sheet Excel workbook: one row
// per registration (team-level) plus one row per individual participant,
// so organisers have both a quick overview and a full attendee list for
// event day. Runs entirely in the browser — no server involved.
async function exportRegistrationsExcel(){
  const btn = document.getElementById('exportExcelBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const all = await tFetchAll('registrations', 'submitted_at', false);
    if(!all.length){ toast('No registrations to export yet', 'info'); return; }

    const regRows = all.map(r=>({
      'Submitted At': fmtDateTime(r.submitted_at),
      'Status': r.status,
      'Player ID': r.player_id || '',
      'Sport': r.sport_name,
      'Category': r.category_id,
      'Event': r.event_label,
      'Gender Category': r.gender_cat || '',
      'Team Name': r.team_name || '',
      'Fee (₹)': r.fee,
      'Phone': r.phone,
      'Flat': r.flat,
      'Participant Count': (r.participants||[]).length,
      'Participants': (r.participants||[]).map(p=>`${p.name} (${p.age}, ${p.gender})`).join('; '),
      'Payment Screenshot': r.screenshot_path ? 'Yes' : 'No (free entry)',
    }));

    const partRows = [];
    all.forEach(r=>{
      (r.participants||[]).forEach(p=>{
        partRows.push({
          'Player ID': r.player_id || '',
          'Status': r.status,
          'Sport': r.sport_name,
          'Category': r.category_id,
          'Event': r.event_label,
          'Participant Name': p.name,
          'Age': p.age,
          'Gender': p.gender,
          'Team Name': r.team_name || '',
          'Contact Phone': r.phone,
          'Flat': r.flat,
          'Submitted At': fmtDateTime(r.submitted_at),
        });
      });
    });

    const bySport = {};
    all.forEach(r=>{ bySport[r.sport_name] = (bySport[r.sport_name]||0) + 1; });
    const summaryRows = [
      {'Metric':'Total Registrations', 'Value': all.length},
      {'Metric':'Pending', 'Value': all.filter(r=>r.status==='pending').length},
      {'Metric':'Approved', 'Value': all.filter(r=>r.status==='approved').length},
      {'Metric':'Rejected', 'Value': all.filter(r=>r.status==='rejected').length},
      {'Metric':'Total Participants', 'Value': partRows.length},
      {'Metric':'—', 'Value':'—'},
      ...Object.entries(bySport).map(([sport,count])=>({'Metric':sport, 'Value':count})),
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(regRows), 'Registrations');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(partRows), 'Participants');
    const fname = `sports-fest-registrations-${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('Excel report downloaded', 'ok');
  }catch(e){
    console.error(e);
    toast('Could not build the report — try again', 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '⬇ Download Excel Report'; }
  }
}

        <span class="badge ${r.status==='approved'?'green':(r.status==='rejected'?'maroon':'gold')}">${r.status}</span>

      ${r.screenshot_path ? `<div style="margin-top:10px;"><span class="thumb-link" data-view-shot="${r.id}">📎 View payment screenshot</span></div>` : ''}
      ${r.player_id ? `<div style="margin-top:10px;"><span class="player-id-tag">${r.player_id}</span></div>` : ''}

  host.querySelectorAll('[data-view-shot]').forEach(el=>{

  host.querySelectorAll('[data-undo]').forEach(el=>{
    el.addEventListener('click', async ()=>{

      const {ok} = await tUpdate('registrations', r.id, {status:'pending', player_id: null});
      if(ok) toast('Reverted to Pending', 'info'); else toast('Could not undo — try again', 'err');
      adminRegistrations();
    });
  });
  host.querySelectorAll('[data-del-reg]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Delete this registration permanently?')) return;
      const r = all.find(x=>x.id===el.dataset.delReg);

      await tDelete('registrations', el.dataset.delReg);

      adminRegistrations();
    });
  });
}

    <div class="form-card" style="max-width:520px;padding:22px;margin-bottom:36px;">
      <div class="field"><label>Sport</label><select id="fbSport">${eligible.map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}</select></div>
      <div class="field"><label>Category</label><select id="fbCategory"></select></div>
      <div id="fbGenderWrap"></div>
      <div class="field">
        <label>Fixtures Board Image</label>
        <div class="upload-box" id="fbBox"><p class="mono" style="font-size:12px;color:var(--slate);">📎 Click to upload a photo of the fixtures board</p><input type="file" id="fbInput" accept="image/*" style="display:none;"></div>
      </div>
      <button class="btn btn-primary" id="fbAddBtn">Upload / Replace Board</button>
    </div>
    <h3 class="h-md" style="margin-bottom:18px;">Current Boards</h3>
    <div id="fbList"><div class="loading-dots">Loading…</div></div>
  `;
  if(!eligible.length){
    document.getElementById('fbList').innerHTML = `<div class="empty-state"><p>No sports with categories are open for fixtures yet.</p></div>`;
    return;
  }
  document.getElementById('fbSport').addEventListener('change', rebuildFbCategoryAndGender);
  rebuildFbCategoryAndGender();

  let fbFile = null;
  const box = document.getElementById('fbBox');
  const input = document.getElementById('fbInput');
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0]; if(!f) return;
    fbFile = f;
    const {dataUrl} = await compressImageToBlob(f, 1400, 0.72);
    box.innerHTML = `<img src="${dataUrl}" style="max-height:180px;margin:0 auto;">`;
    box.addEventListener('click', ()=>input.click());
  });
  document.getElementById('fbAddBtn').addEventListener('click', async ()=>{
    if(!fbFile){ toast('Choose an image first', 'err'); return; }
    const sportId = document.getElementById('fbSport').value;
    const categoryId = document.getElementById('fbCategory').value;
    const genderSel = document.getElementById('fbGender');
    const gender = genderSel ? genderSel.value : '';
    const pathSafeGender = gender || 'na';
    const path = await uploadImage('fixture-boards', fbFile, null, {path:`${sportId}_${categoryId}_${pathSafeGender}.jpg`, upsert:true});
    if(!path){ toast('Upload failed — try again', 'err'); return; }
    const {error} = await sb.from('fixture_boards').upsert(
      {sport_id: sportId, category_id: categoryId, gender, image_path: path, updated_at: new Date().toISOString()},
      {onConflict: 'sport_id,category_id,gender'}
    );
    if(error){ console.error(error); toast('Could not save board — try again', 'err'); return; }
    toast('Fixtures board uploaded', 'ok');
    adminFixtures();
  });

  const list = await tFetchAll('fixture_boards', 'sport_id', true);
  const host = document.getElementById('fbList');
  if(!list.length){ host.innerHTML = `<div class="empty-state"><p>No boards uploaded yet.</p></div>`; return; }
  host.innerHTML = `<div class="grid grid-3">${list.map(b=>{
    const sp = getSport(b.sport_id);
    const catLabel = sp?.registration.categories.find(c=>c.id===b.category_id)?.label || b.category_id;
    const genderLabel = b.gender ? ` — ${FIXTURE_GENDER_LABELS[b.gender]||b.gender}` : '';
    const url = publicUrl('fixture-boards', b.image_path, b.updated_at);
    return `<div class="card" style="padding:14px;">
      <div class="tag">${sp?sp.icon+' '+sp.name:b.sport_id}</div>
      <h3 style="font-size:15px;margin-top:6px;">${esc(catLabel)}${genderLabel}</h3>
      <img src="${url}" style="margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);">
      <div class="ractions" style="margin-top:10px;"><button class="btn-del" data-del-fb data-sport="${b.sport_id}" data-cat="${b.category_id}" data-gender="${b.gender}" data-path="${b.image_path}">Remove</button></div>
    </div>`;
  }).join('')}</div>`;
  host.querySelectorAll('[data-del-fb]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Remove this fixtures board?')) return;
      await sb.storage.from('fixture-boards').remove([el.dataset.path]);
      const {error} = await sb.from('fixture_boards').delete()
        .eq('sport_id', el.dataset.sport).eq('category_id', el.dataset.cat).eq('gender', el.dataset.gender);
      if(error) console.error(error);
      toast('Removed', 'info');
      adminFixtures();
    });
  });
}

/* ---------- Admin: Sponsorships ---------- */
async function adminSponsors(){
  const main = document.getElementById('adminMain');
  main.innerHTML = `
    <h3 class="h-md" style="margin-bottom:18px;">Add Sponsor</h3>
    <div class="form-card" style="max-width:640px;padding:22px;margin-bottom:36px;">
      <div class="form-grid-2">
        <div class="field"><label>Name</label><input type="text" id="spName"></div>
        <div class="field"><label>Tier</label><select id="spTier">${SPONSOR_TIERS.map(t=>`<option value="${t}">${SPONSOR_TIER_LABEL[t]}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Website (optional)</label><input type="url" id="spWebsite" placeholder="https://"></div>
      <div class="field"><label>Short blurb (optional)</label><textarea id="spBlurb" rows="2"></textarea></div>
      <div class="field">
        <label>Logo (optional)</label>
        <div class="upload-box" id="spLogoBox"><p class="mono" style="font-size:12px;color:var(--slate);">📎 Click to upload logo</p><input type="file" id="spLogoInput" accept="image/*" style="display:none;"></div>
      </div>
      <button class="btn btn-primary" id="spAddBtn">Add Sponsor</button>
    </div>
    <h3 class="h-md" style="margin-bottom:18px;">All Sponsors</h3>
    <div id="spList"><div class="loading-dots">Loading…</div></div>
  `;
  let spLogoFile = null;
  const box = document.getElementById('spLogoBox');
  const input = document.getElementById('spLogoInput');
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0]; if(!f) return;
    spLogoFile = f;
    const {dataUrl} = await compressImageToBlob(f, 300, 0.75);
    box.innerHTML = `<img src="${dataUrl}" style="max-height:80px;margin:0 auto;">`;
    box.addEventListener('click', ()=>input.click());
  });
  document.getElementById('spAddBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('spName').value.trim();
    if(!name){ toast('Enter a sponsor name', 'err'); return; }
    let logoUrl = null;
    if(spLogoFile){
      const path = await uploadImage('sponsor-logos', spLogoFile, 'logo');
      if(path) logoUrl = publicUrl('sponsor-logos', path);
    }
    const item = {name, tier:document.getElementById('spTier').value, website:document.getElementById('spWebsite').value.trim(), blurb:document.getElementById('spBlurb').value.trim(), logo_url:logoUrl};
    const {ok} = await tInsert('sponsors', item);
    if(ok) toast('Sponsor added', 'ok'); else toast('Could not add sponsor', 'err');
    adminSponsors();
  });
  const list = await tFetchAll('sponsors', 'name', true);
  const host = document.getElementById('spList');
  if(!list.length){ host.innerHTML = `<div class="empty-state"><p>No sponsors yet.</p></div>`; return; }
  host.innerHTML = list.map(s=>`
    <div class="reg-item">
      <div class="rtop">
        <div><div class="rname" style="font-size:16px;">${esc(s.name)}</div><div class="rmeta">${SPONSOR_TIER_LABEL[s.tier]||s.tier}</div></div>
        ${s.logo_url?`<img src="${s.logo_url}" style="width:40px;height:40px;object-fit:contain;">`:''}
      </div>
      <div class="ractions"><button class="btn-del" data-del-spn="${s.id}">Delete</button></div>
    </div>`).join('');
  host.querySelectorAll('[data-del-spn]').forEach(el=>{
    el.addEventListener('click', async ()=>{ if(!confirm('Delete this sponsor?')) return; await tDelete('sponsors', el.dataset.delSpn); toast('Deleted','info'); adminSponsors(); });
  });
}

/* ---------- Admin: Photos & Highlights ---------- */
async function adminPhotos(){
  const main = document.getElementById('adminMain');
  main.innerHTML = `
    <h3 class="h-md" style="margin-bottom:18px;">Add Photo / Highlight</h3>
    <div class="form-card" style="max-width:640px;padding:22px;margin-bottom:36px;">
      <div class="field">
        <label>Photo</label>
        <div class="upload-box" id="phBox"><p class="mono" style="font-size:12px;color:var(--slate);">📎 Click to upload a photo</p><input type="file" id="phInput" accept="image/*" style="display:none;"></div>
      </div>
      <div class="field"><label>Caption</label><input type="text" id="phCaption"></div>
      <button class="btn btn-primary" id="phAddBtn">Post Photo</button>
      <p class="hint">Posted photos also appear as a "Photo / Highlight" item on the Updates page.</p>
    </div>
    <h3 class="h-md" style="margin-bottom:18px;">All Photos</h3>
    <div id="phList" class="grid grid-3"><div class="loading-dots">Loading…</div></div>
  `;
  let phFile = null;
  const box = document.getElementById('phBox');
  const input = document.getElementById('phInput');
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0]; if(!f) return;
    phFile = f;
    const {dataUrl} = await compressImageToBlob(f, 900, 0.65);
    box.innerHTML = `<img src="${dataUrl}" style="max-height:160px;margin:0 auto;">`;
    box.addEventListener('click', ()=>input.click());
  });
  document.getElementById('phAddBtn').addEventListener('click', async ()=>{
    if(!phFile){ toast('Upload a photo first', 'err'); return; }
    const caption = document.getElementById('phCaption').value.trim();
    const path = await uploadImage('event-photos', phFile, 'photo');
    if(!path){ toast('Upload failed — try again', 'err'); return; }
    const url = publicUrl('event-photos', path);
    const date = new Date().toISOString();
    const {ok} = await tInsert('photos', {url, caption, date});
    if(ok){
      await tInsert('updates', {title:caption||'New photo posted', body:'A new photo/highlight has been added to the gallery.', category:'photo-highlight', pinned:false, date});
      toast('Photo posted', 'ok');
    }else{ toast('Could not save photo', 'err'); }
    adminPhotos();
  });
  const list = await tFetchAll('photos', 'date', false);
  const host = document.getElementById('phList');
  if(!list.length){ host.innerHTML = `<div class="empty-state"><p>No photos yet.</p></div>`; return; }
  host.innerHTML = list.map(p=>`
    <div class="card" style="padding:12px;">
      <img src="${p.url}" style="margin-bottom:8px;">
      <p style="font-size:13px;">${esc(p.caption||'')}</p>
      <button class="btn-del" style="margin-top:8px;" data-del-pho="${p.id}">Delete</button>
    </div>`).join('');
  host.querySelectorAll('[data-del-pho]').forEach(el=>{
    el.addEventListener('click', async ()=>{ if(!confirm('Delete this photo?')) return; await tDelete('photos', el.dataset.delPho); toast('Deleted','info'); adminPhotos(); });
  });
}

<script>
/* =========================================================
   MAIN ROUTER
   ========================================================= */
async function render(){
  if(!CONFIG_READY){
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--cream);padding:40px 20px;">
        <div style="max-width:520px;">
          <div class="eyebrow" style="color:var(--gold-light)">Setup needed</div>
          <h1 class="h-md" style="color:var(--bright);">Connect Supabase to launch this site</h1>
          <p style="margin-top:14px;color:var(--slate);font-size:15px;line-height:1.6;">
            Open <code style="background:#000;padding:2px 6px;">index.html</code>, find <code style="background:#000;padding:2px 6px;">SUPABASE_URL</code> and
            <code style="background:#000;padding:2px 6px;">SUPABASE_ANON_KEY</code> near the top of the script, and paste in the values from your
            Supabase project's <strong>Settings → API</strong> page. See README.md for the full walkthrough.
          </p>
        </div>
      </div>`;
    return;
  }
  const {route, param} = parseHash();
  STATE.route = route;
  STATE.params = {param};
  window.scrollTo(0,0);
  try{
    switch(route){
      case 'home': await renderHome(); break;
      case 'sports': await renderSportsIndex(); break;
      case 'sport': await renderSportDetail(param); break;
      case 'schedule': await renderSchedule(); break;
      case 'rules': await renderRulesIndex(); break;
      case 'fixtures': await renderFixtures(); break;
      case 'updates': await renderUpdates(param); break;
      case 'sponsors': await renderSponsors(); break;
      case 'contact': await renderContact(); break;
      case 'register': await renderRegister(param); break;
      case 'admin': await renderAdmin(); break;
      default: await renderHome();
    }
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML = `<div class="wrap" style="padding:80px 0;text-align:center;"><h2 class="h-md">Something went wrong loading this page.</h2><p style="margin-top:10px;"><a href="#home" style="color:var(--maroon);">Return home →</a></p></div>`;
  }
}

render();
</script>
